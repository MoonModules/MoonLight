openapi: 3.1.0
info:
  title: MoonLight device API
  version: 7.1.0-dev
  summary: The HTTP routes a MoonLight device serves, on port 80 on a board and 8080 on a host.
  description: |
    Every route answers a client sending no `Origin` and a page from this network, which a private, shared or loopback address, `localhost`, a `.local`, `.home.arpa` or `.internal` name or one label names, or the device itself under the name it was opened by; a page from beyond it gets 403 on every route, WebSockets included.
    A request's `Host` names an IP address, a local name or the device's own name under any domain; every other `Host` gets 403, which stops a DNS-rebinding page.
    An `OPTIONS` request on any path from such a page answers 204 as the CORS preflight.
    A request body is read as JSON whatever its `Content-Type` says, and a number rides as a JSON number.
    A malformed `Content-Length` answers 400 and an oversized one 413, an unknown path 404 and an unknown method 405.
    The live state and the preview travel over the `/ws` and `/wsp` WebSockets, described in [Integrating](integrating.html#websocket).
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: http://{device}
    variables:
      device:
        default: moonlight.local
        description: The device's address or mDNS name.
tags:
  - name: State
    description: The module tree as a whole, read and written as one document.
  - name: Modules
    description: One module at a time, addressed by its name.
  - name: Lists
    description: The rows of an editable list control, such as the presets or WiFi's known networks.
  - name: Files
    description: The device filesystem, and a card mounted at `/sd`.
  - name: Firmware
    description: Firmware and MoonBase installs, and the reboot.
  - name: System
    description: Metrics, the type catalog and the MoonLive script catalog.
  - name: WLED compatibility
    description: The WLED-shaped routes the WLED apps and Home Assistant read.
  - name: Media
    description: The HLS stream the HLS driver writes.

paths:
  /api/state:
    get:
      tags: [State]
      operationId: getState
      summary: The whole module tree, as the page renders it.
      responses:
        "200":
          description: Every top-level module with its controls and children.
          content:
            application/json:
              schema:
                type: object
                properties:
                  modules:
                    type: array
                    items: { $ref: "#/components/schemas/Module" }
    patch:
      tags: [State]
      operationId: applyState
      summary: Applies a state document as a JSON Merge Patch (RFC 7386); its rules are in Integrating.
      parameters: &stateParameters
        - name: live
          in: query
          required: false
          description: 1 applies a document that drives rather than configures, such as a show building its look on another device, checked the same way and marking nothing to save.
          schema: { type: integer, enum: [0, 1] }
      requestBody: { $ref: "#/components/requestBodies/StateDocument" }
      responses: &stateResponses
        "200": { $ref: "#/components/responses/StateResult" }
        "400": { $ref: "#/components/responses/StateResult" }
        "411": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "507": { $ref: "#/components/responses/Error" }
    post:
      tags: [State]
      operationId: applyStatePost
      summary: The same as PATCH, for a client that cannot send PATCH.
      parameters: *stateParameters
      requestBody: { $ref: "#/components/requestBodies/StateDocument" }
      responses: *stateResponses

  /api/system:
    get:
      tags: [System]
      operationId: getSystem
      summary: The device summary, who it is and what it runs, then frame rate, tick time, memory, uptime and per-module timing.
      responses:
        "200":
          description: The device's live metrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }

  /api/types:
    get:
      tags: [System]
      operationId: listTypes
      summary: Every module type this build knows, with its role, the children it accepts and its defaults.
      responses:
        "200":
          description: The type catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  types:
                    type: array
                    items: { $ref: "#/components/schemas/TypeInfo" }

  /api/scripts:
    get:
      tags: [System]
      operationId: listScripts
      summary: The factory MoonLive scripts by role, and the tag to fetch their sources from.
      responses:
        "200":
          description: The script catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScriptCatalog" }

  /api/control:
    post:
      tags: [Modules]
      operationId: setControl
      summary: Sets one control of one module.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [module, control, value]
              properties:
                module: { type: string, description: The module's name. }
                control: { type: string, description: The control's name. }
                value: { description: "The new value, typed as the control is." }
            example: { module: Rainbow, control: speed, value: 40 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/modules:
    post:
      tags: [Modules]
      operationId: addModule
      summary: Adds a module under a parent and returns the name it was given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, parent_id]
              properties:
                type: { type: string, description: "The module type, as /api/types names it." }
                parent_id: { type: string, description: The parent module's name. }
                id: { type: string, maxLength: 15, description: "The name to give it, exactly: up to 15 bytes of UTF-8, so fewer characters where they take more than one byte; refused when taken or longer." }
                name: { type: string, description: "A name to start from when `id` is absent, made free as the type's default is: shortened and numbered to fit, as `NetworkReceiv-2`. The type's default name when both are absent." }
            example: { type: RainbowEffect, parent_id: Layer }
      responses:
        "200":
          description: The module is added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
                  name: { type: string, description: The name every later call addresses it by. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/modules/{name}:
    parameters: [{ $ref: "#/components/parameters/ModuleName" }]
    get:
      tags: [Modules]
      operationId: getModule
      summary: One module as /api/state carries it.
      responses:
        "200":
          description: The module with its controls and children.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Module" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Modules]
      operationId: renameModule
      summary: Renames a module in place, its controls and children kept; a top-level module and one the user cannot remove keep their names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 15, description: The new name, which no other module holds. }
      responses:
        "200":
          description: Renamed; `name` is the module's name now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  name: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Modules]
      operationId: deleteModule
      summary: Removes a module and its children.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/modules/{name}/document:
    parameters: [{ $ref: "#/components/parameters/ModuleName" }]
    get:
      tags: [Modules]
      operationId: getModuleDocument
      summary: One module as a state document rooted at the top level, which PATCH /api/state applies back.
      responses:
        "200":
          description: The module's state document, secrets left out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateDocument" }
        "404": { $ref: "#/components/responses/Error" }

  /api/modules/{name}/move:
    parameters: [{ $ref: "#/components/parameters/ModuleName" }]
    post:
      tags: [Modules]
      operationId: moveModule
      summary: Moves a module to another position among its siblings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: integer, minimum: 0, description: "The new position, counted from 0." }
      responses:
        "200":
          description: The module is at that position; `noop` says it was there already.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
                  noop: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/modules/{name}/replace:
    parameters: [{ $ref: "#/components/parameters/ModuleName" }]
    post:
      tags: [Modules]
      operationId: replaceModule
      summary: Swaps a module for another type in the same slot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, description: The new module type. }
                name: { type: string, description: "The new name; else a custom current name is kept, else the type's default." }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/list/{module}/{control}:
    parameters:
      - { $ref: "#/components/parameters/ListModule" }
      - { $ref: "#/components/parameters/ListControl" }
    post:
      tags: [Lists]
      operationId: addListRow
      summary: Appends a row and returns its stable id.
      responses:
        "200":
          description: The row is added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
                  id: { type: integer, description: "The row's id, which later calls name." }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/list/{module}/{control}/{row}:
    parameters:
      - { $ref: "#/components/parameters/ListModule" }
      - { $ref: "#/components/parameters/ListControl" }
      - { $ref: "#/components/parameters/ListRow" }
    patch:
      tags: [Lists]
      operationId: editListRow
      summary: Edits one field of a row, or moves the row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [field, value]
                  properties:
                    field: { type: string, description: The field to set. }
                    value: { description: Its new value. }
                - type: object
                  required: [to]
                  properties:
                    to: { type: integer, minimum: 0, maximum: 255, description: The row's new position. }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Lists]
      operationId: deleteListRow
      summary: Removes a row.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/list/{module}/{control}/{row}/apply:
    parameters:
      - { $ref: "#/components/parameters/ListModule" }
      - { $ref: "#/components/parameters/ListControl" }
      - { $ref: "#/components/parameters/ListRow" }
    post:
      tags: [Lists]
      operationId: applyListRow
      summary: Runs a row's action, such as applying a preset.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/dir:
    parameters: [{ $ref: "#/components/parameters/FilePath" }]
    get:
      tags: [Files]
      operationId: listDir
      summary: One directory's children, one level deep.
      parameters:
        - name: hidden
          in: query
          description: "`1` includes the entries whose name starts with a dot."
          schema: { type: integer, enum: [1] }
      responses:
        "200":
          description: The directory's entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirEntry" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: [Files]
      operationId: makeDir
      summary: Creates a directory.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Files]
      operationId: removeEntry
      summary: Removes a file, or a directory and everything in it.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/file:
    parameters: [{ $ref: "#/components/parameters/FilePath" }]
    get:
      tags: [Files]
      operationId: readFile
      summary: One file's contents; `/.config` answers 403 to a client on the access point.
      responses:
        "200":
          description: The file's bytes.
          content:
            text/plain: {}
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "507": { $ref: "#/components/responses/Error" }
    post:
      tags: [Files]
      operationId: writeFile
      summary: Writes a file atomically, at most 256 KB on flash; a written `/.config` file applies live.
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "411": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "507": { $ref: "#/components/responses/Error" }

  /api/reboot:
    post:
      tags: [Firmware]
      operationId: reboot
      summary: Saves pending changes and restarts the device.
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/firmware/url:
    post:
      tags: [Firmware]
      operationId: installFirmwareUrl
      summary: Installs firmware the device fetches itself and restarts on it; with a MoonBase it reboots into MoonBase to install.
      requestBody: { $ref: "#/components/requestBodies/Url" }
      responses:
        "202":
          description: The install has started; `moonbase` says it continues in MoonBase.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
                  moonbase: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }

  /api/firmware/upload:
    post:
      tags: [Firmware]
      operationId: uploadFirmware
      summary: Installs an uploaded firmware image and reboots into it.
      requestBody: { $ref: "#/components/requestBodies/Image" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "409": { $ref: "#/components/responses/Error" }
        "411": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }

  /api/relay/esphome:
    post:
      tags: [Firmware]
      operationId: relayEsphome
      summary: Hands the uploaded image on to an ESPHome device through ESPHome's own update protocol (TCP 3232), the body passed through as it arrives.
      parameters:
        - { name: host, in: query, required: true, description: "The ESPHome device's IPv4 address, on this network: any other answers 403.", schema: { type: string, format: ipv4 } }
        - { name: md5, in: query, required: true, description: "The image's MD5, which ESPHome asks for before the image.", schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
      requestBody: { $ref: "#/components/requestBodies/Image" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "411": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
        "507": { $ref: "#/components/responses/Error" }

  /api/firmware/moonbase:
    post:
      tags: [Firmware]
      operationId: bootMoonBase
      summary: Reboots into MoonBase with nothing staged, ready to take an image.
      responses:
        "200":
          description: The device is rebooting into MoonBase.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
                  moonbase: { const: true }
        "409": { $ref: "#/components/responses/Error" }

  /api/firmware/moonbase-update-url:
    post:
      tags: [Firmware]
      operationId: installMoonBaseUrl
      summary: Installs a new MoonBase the device fetches itself.
      requestBody: { $ref: "#/components/requestBodies/Url" }
      responses:
        "202": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }

  /api/firmware/moonbase-update:
    post:
      tags: [Firmware]
      operationId: uploadMoonBase
      summary: Installs an uploaded MoonBase image, leaving the running app as it is.
      requestBody: { $ref: "#/components/requestBodies/Image" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "409": { $ref: "#/components/responses/Error" }
        "411": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }

  /api/firmware/coprocessor-update-url:
    post:
      tags: [Firmware]
      operationId: installCoprocessorUrl
      summary: Updates the WiFi coproc from an image the device fetches itself, by default its release's image matching this firmware's ESP-Hosted version; the device restarts after.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, maxLength: 255, description: "The image to install; omitted, the release's matching `shared-c6-slave-<version>.bin`." }
      responses:
        "202": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }

  /api/firmware/coprocessor-update:
    post:
      tags: [Firmware]
      operationId: uploadCoprocessor
      summary: Updates the WiFi coproc from an uploaded image, over a link that is up; the device restarts after.
      requestBody: { $ref: "#/components/requestBodies/Image" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "409": { $ref: "#/components/responses/Error" }
        "411": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }

  /hls/{file}:
    get:
      tags: [Media]
      operationId: getHlsFile
      summary: One HLS playlist or segment, uncached.
      parameters:
        - name: file
          in: path
          required: true
          description: A flat file name, such as `stream.m3u8`.
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: The playlist or segment.
          content:
            application/vnd.apple.mpegurl: {}
            video/mp2t: {}
            video/mp4: {}
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /json:
    get:
      tags: [WLED compatibility]
      operationId: getWledDevice
      summary: The WLED state, info, effects and palettes in one, as Home Assistant's WLED integration reads it.
      responses:
        "200":
          description: The WLED device object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { $ref: "#/components/schemas/WledState" }
                  info: { $ref: "#/components/schemas/WledInfo" }
                  effects: { type: array, items: { type: string } }
                  palettes: { type: array, items: { type: string } }
    post:
      tags: [WLED compatibility]
      operationId: postWledState
      summary: Applies a WLED state document, the same one `/json/state` takes.
      description: Answers `{"success":true}`, or the whole device object when the body sets `"v":true`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WledStateRequest" }
      responses:
        "200":
          description: The success object, or the device object for `"v":true`.
          content:
            application/json:
              schema: { type: object }

  /json/info:
    get:
      tags: [WLED compatibility]
      operationId: getWledInfo
      summary: The WLED info the WLED apps validate a discovered device with.
      responses:
        "200":
          description: The WLED info object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WledInfo" }

  /json/state:
    get:
      tags: [WLED compatibility]
      operationId: getWledState
      summary: On-off, brightness, the active preset and the palette color.
      responses:
        "200": { $ref: "#/components/responses/WledState" }
    post:
      tags: [WLED compatibility]
      operationId: setWledState
      summary: Applies a WLED state document, and answers the resulting state.
      description: A segment is a layer, so `seg` sets a layer's enabled flag, opacity, effect, sliders and palette. See [the WLED API](https://moonmodules.org/MoonLight/reference/integrating/).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WledStateRequest" }
      responses:
        "200": { $ref: "#/components/responses/WledState" }

  /json/si:
    get:
      tags: [WLED compatibility]
      operationId: getWledStateInfo
      summary: The WLED state and info in one call.
      responses:
        "200":
          description: The state and info objects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { $ref: "#/components/schemas/WledState" }
                  info: { $ref: "#/components/schemas/WledInfo" }

  /json/effects:
    get:
      tags: [WLED compatibility]
      operationId: getWledEffects
      summary: The effect type names, in the order a segment's `fx` indexes.
      responses:
        "200": { $ref: "#/components/responses/WledNames" }

  /json/eff:
    get:
      tags: [WLED compatibility]
      operationId: getWledEff
      summary: The short form of `/json/effects`.
      responses:
        "200": { $ref: "#/components/responses/WledNames" }

  /json/palettes:
    get:
      tags: [WLED compatibility]
      operationId: getWledPalettes
      summary: The palette names, in the order a segment's `pal` indexes, empty when no light output is running.
      responses:
        "200": { $ref: "#/components/responses/WledNames" }

  /json/pal:
    get:
      tags: [WLED compatibility]
      operationId: getWledPal
      summary: The short form of `/json/palettes`.
      responses:
        "200": { $ref: "#/components/responses/WledNames" }

  /json/fxdata:
    get:
      tags: [WLED compatibility]
      operationId: getWledEffectData
      summary: One string per effect, `sliders;colors;palette;flags`, naming the effect's own controls.
      responses:
        "200": { $ref: "#/components/responses/WledNames" }

  /json/fxda:
    get:
      tags: [WLED compatibility]
      operationId: getWledFxda
      summary: The short form of `/json/fxdata`.
      responses:
        "200": { $ref: "#/components/responses/WledNames" }
  /win:
    get:
      tags: [WLED compatibility]
      operationId: getWledWin
      summary: WLED's older HTTP API, with the keys in the query.
      description: "`T` sets power (0 off, 1 on, 2 toggle), `A` brightness and `PL` a preset slot. `SS` selects the layer the remaining keys address, the first by default: `FX` the effect, `SX`, `IX`, `X1`, `X2` and `X3` its sliders, `M1` to `M3` its options, `FP` the palette, `SB` the layer's opacity, `CL` a color in hex and `R`, `G` and `B` its channels. A value that does not start with a digit is ignored."
      responses:
        "200": { $ref: "#/components/responses/WledState" }

  /win&{keys}:
    get:
      tags: [WLED compatibility]
      operationId: getWledWinInPath
      summary: The same API with the keys after `&` in the path, as WLED's older clients send them.
      parameters:
        - name: keys
          in: path
          required: true
          description: "`A=128&T=1`, the keys `/win` takes."
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/WledState" }

  /presets.json:
    get:
      tags: [WLED compatibility]
      operationId: getWledPresets
      summary: The look presets in WLED's format, keyed by a slot counted from 1.
      responses:
        "200":
          description: 'Slot to `{"n": name}`, or `{"0": {}}` when there is none.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    n: { type: string }

components:
  parameters:
    ModuleName:
      name: name
      in: path
      required: true
      description: The module's name, percent-encoded.
      schema: { type: string, maxLength: 15 }
    ListModule:
      name: module
      in: path
      required: true
      description: The name of the module holding the list.
      schema: { type: string }
    ListControl:
      name: control
      in: path
      required: true
      description: The list control's name.
      schema: { type: string }
    ListRow:
      name: row
      in: path
      required: true
      description: The row's id, or its name in a list whose names are unique.
      schema: { type: string }
    FilePath:
      name: path
      in: query
      required: true
      description: The path on the device, rooted at its filesystem; `..` is refused.
      schema: { type: string }

  requestBodies:
    StateDocument:
      required: true
      description: A state document, at most 32 KB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StateDocument" }
          example: { Effects: { Layer: { Swirl: { type: RainbowEffect, speed: 90 } } } }
    Url:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [url]
            properties:
              url: { type: string, pattern: "^https://", maxLength: 255, description: "The image to fetch, over https only: nothing authenticates an image fetched over plain http." }
              sha256: { type: string, pattern: "^[0-9a-fA-F]{64}$", description: "The image's SHA-256, which a host checks before it installs its new program; a board's image carries its own." }
    Image:
      required: true
      description: The binary image, sent with a Content-Length.
      content:
        application/octet-stream: {}

  responses:
    Ok:
      description: Done.
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { const: true }
    Error:
      description: 'The reason, as `{"error": ...}`.'
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    StateResult:
      description: The document's result; a refusal names the first failure and where it is.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StateResult" }
    WledNames:
      description: A JSON array of strings, one per effect or palette, in the order `fx` or `pal` indexes.
      content:
        application/json:
          schema: { type: array, items: { type: string } }
    WledState:
      description: The WLED state object.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WledState" }

  schemas:
    StateDocument:
      type: object
      description: Part of the module tree keyed by module name; a value sets a control, an object is a child module, `null` removes one.
      additionalProperties: true
    StateResult:
      type: object
      properties:
        ok: { const: true }
        changes: { type: integer, description: How many changes applied. }
        deferred: { type: integer, description: Script controls set after the rebuild compiles their script. }
        error: { type: string }
        at: { type: string, description: The dotted path of the first failure. }
    Module:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        role: { type: string }
        enabled: { type: boolean }
        respectsEnabled: { type: boolean, description: False for a module that keeps running whatever `enabled` says. }
        held: { type: boolean, description: Safe mode holds the module. }
        tickTimeUs: { type: integer }
        classSize: { type: integer }
        dynamicBytes: { type: integer }
        tags: { type: string }
        status: { type: string }
        severity: { type: string, enum: [status, warning, error] }
        userEditable: { type: boolean, description: Present and false when the module cannot be deleted or replaced. }
        controls:
          type: array
          items: { $ref: "#/components/schemas/Control" }
        children:
          type: array
          items: { $ref: "#/components/schemas/Module" }
    Control:
      type: object
      description: A control's name, type and value, plus the flags and extras its type carries.
      required: [name, type, value]
      properties:
        name: { type: string }
        type: { type: string }
        value: { description: The current value; a password is obfuscated. }
        readonly: { type: boolean }
        hidden: { type: boolean }
      additionalProperties: true
    System:
      type: object
      properties:
        version: { type: string, description: The firmware version. }
        build: { type: string, description: The build id. }
        firmware: { type: string, description: "The firmware variant, which names its image firmware-<firmware>-v<version>.bin: a board's variant, or a host's host-<os>-<arch>." }
        update:
          type: string
          enum: [self, container, manual]
          description: "How it takes a new version: it installs one itself (a board, or a host whose program sits in a folder it can write), its container is replaced from outside, or someone installs it by hand (a program in a folder it cannot write)."
        moonbaseMismatch: { type: string, description: "MoonBase's version, present only while it speaks another handoff version than the app, so a map offers the matching one." }
        coprocessorMismatch: { type: string, description: "The WiFi coprocessor's firmware line, present only while it differs from what the app needs." }
        mac: { type: string, description: "The MAC address, the device identity." }
        name: { type: string, description: "The device name, which every network name derives from." }
        board: { type: string, description: "The board model tooling set, empty until set." }
        mode: { type: integer, enum: [0, 1, 2], description: "How much of the UI its reader sees: 0 user, 1 expert, 2 developer, which also puts the device on the latest update channel." }
        chip: { type: string }
        rssi: { type: integer, description: "The WiFi signal in dBm, 0 off WiFi." }
        outputs:
          type: array
          description: Each enabled driver that lights something.
          items:
            type: object
            properties:
              driver: { type: string, description: The driver's type. }
              lights: { type: integer, description: The lights its window sends. }
              fps: { type: integer, description: "Frames it sends a second: its own count, or the device's frame rate." }
              movingHeads: { type: boolean, description: Present and true when its fixtures aim. }
        effects:
          type: array
          description: Each enabled effect on an enabled layer, by name.
          items: { type: string }
        fps: { type: integer }
        tickTimeUs: { type: integer }
        freeHeap: { type: integer }
        freeInternal: { type: integer }
        maxBlock: { type: integer, description: The largest free internal block. }
        maxExec: { type: integer, description: The largest free executable block. }
        allocated: { type: integer }
        allocPeak: { type: integer }
        allocBlocks: { type: integer }
        uptime: { type: integer, description: Seconds since boot. }
        modules:
          type: array
          description: Every module, depth first.
          items:
            type: object
            properties:
              name: { type: string }
              us: { type: integer, description: Tick time in microseconds. }
              classSize: { type: integer }
              heap: { type: integer }
              status: { type: string }
              severity: { type: string, enum: [status, warning, error] }
    TypeInfo:
      type: object
      properties:
        name: { type: string, description: The factory name a request uses. }
        displayName: { type: string }
        role: { type: string }
        docPath: { type: string }
        tags: { type: string }
        dim: { type: integer }
        acceptsChildRoles: { type: string }
        minMode: { type: integer, description: "The reader's mode the type's cards need: 0 user, 1 expert, 2 developer." }
        defaults: { type: object, description: Control name to default value. }
    ScriptCatalog:
      type: object
      properties:
        tag: { type: string, description: The git ref the sources are fetched from. }
        dir: { type: string, description: The factory script directory. }
        effects: { $ref: "#/components/schemas/ScriptGroup" }
        layouts: { $ref: "#/components/schemas/ScriptGroup" }
        modifiers: { $ref: "#/components/schemas/ScriptGroup" }
        services: { $ref: "#/components/schemas/ScriptGroup" }
        palettes: { $ref: "#/components/schemas/ScriptGroup" }
    ScriptGroup:
      type: object
      description: Parallel arrays, one entry per script.
      properties:
        folder: { type: string }
        names: { type: array, items: { type: string } }
        dim: { type: array, items: { type: integer } }
        tags: { type: array, items: { type: string } }
        sub: { type: array, items: { type: string } }
    DirEntry:
      type: object
      properties:
        name: { type: string }
        isDir: { type: boolean }
        size: { type: integer }
    WledState:
      type: object
      properties:
        "on": { type: boolean }
        bri: { type: integer }
        ps: { type: integer, description: "The active look preset's slot, or -1." }
        seg:
          type: array
          items: { $ref: "#/components/schemas/WledSegment" }
      additionalProperties: true
    WledStateRequest:
      type: object
      description: The WLED state a client sends. Every field is optional and an unknown one is ignored. A segment is a layer.
      properties:
        "on": { oneOf: [{ type: boolean }, { const: t }], description: Master power, or "t" to toggle it. }
        bri: { type: integer, minimum: 0, maximum: 255, description: Brightness. }
        ps: { type: integer, description: A preset slot as /presets.json numbers it. }
        v: { type: boolean, description: On `/json`, answer the whole device object. }
        seg:
          description: One segment object or an array of them. An array element without `id` addresses the layer at its index, a lone object the first layer.
          oneOf:
            - { $ref: "#/components/schemas/WledSegment" }
            - type: array
              items: { $ref: "#/components/schemas/WledSegment" }
      additionalProperties: true
    WledSegment:
      type: object
      description: A layer. A write names it by `id` and sets the fields it carries; a state lists every one.
      properties:
        id: { type: integer, description: "The layer's index." }
        n: { type: string, description: "The layer's name." }
        "on": { oneOf: [{ type: boolean }, { const: t }], description: "The layer's enabled flag, or \"t\" to toggle it." }
        bri: { type: integer, minimum: 0, maximum: 255, description: "The layer's opacity." }
        lc: { type: integer, description: "The segment's capability code, 1 for RGB, which Home Assistant creates its light from." }
        fx: { type: integer, description: "The index of the layer's first effect among `effects`." }
        sx: { type: integer, minimum: 0, maximum: 255, description: "The effect's first byte control; `ix`, `c1` and `c2` are its next three, and `c3` its fifth, 0 to 31." }
        o1: { type: boolean, description: "The effect's first Bool control; `o2` and `o3` are its next two." }
        pal: { type: integer, description: The palette index of Drivers, the same on every segment. }
        col: { type: array, items: { type: array, items: { type: integer } }, description: "The primary color as [r,g,b], or a hex string, which a write maps to the nearest palette." }
    WledInfo:
      type: object
      description: One object on /json, /json/info and /json/si, since python-wled merges each poll of /json/si into the first /json.
      properties:
        ver: { type: string, description: "A sentinel, not the MoonLight version." }
        name: { type: string }
        mac: { type: string }
        ip: { type: string }
        leds: { type: object, properties: { count: { type: integer } } }
        wifi: { type: object, properties: { rssi: { type: integer }, signal: { type: integer } } }
        fs: { type: object, properties: { t: { type: integer }, u: { type: integer }, pmt: { type: integer } } }
        brand: { const: WLED }
        product: { const: MoonModules }
