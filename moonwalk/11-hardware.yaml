# yaml-language-server: $schema=moonwalk.schema.json
stage: Run on hardware
summary: The change built, flashed and running on a board or a Teensy.
processes:
  - id: esp32-build-flash
    title: Build, flash and monitor an ESP32
    actor: contributor
    goal: A bench board runs the change the desktop could not prove.
    systems: [MoonDeck]
    dependsOn: [desktop-build-test]
    intro: |
      ESP-IDF directly, not the Arduino framework, at the pinned [ESP-IDF version](reference/build-system.md#esp-idf-version). The firmware variants and their keys: [Firmware variants](reference/build-system.md#firmware-variants).

      A board build and flash happen only when the product owner approves them, once the desktop is clean and its result judged. Never build to confirm something compiles, at the end of a phase or for an interesting measurement. Bench boards are free in risk and costly in time: nothing on them is precious, and the product owner still says when a board is written to. A change that could brick, boot-loop or wipe one gets a one-sentence heads-up.
    inputs:
      type: object
      properties:
        platform: { type: string, enum: [macOS, Linux, Windows], description: "Which computer?" }
    steps:
      - id: clone
        section: Once per machine
        say: Clone ESP-IDF into ~/esp/esp-idf.
        given: [{ input: platform, in: [macOS, Linux] }]
        when: { run: { command: "git clone --depth 1 --recursive --shallow-submodules --branch <PINNED_IDF_VERSION> https://github.com/espressif/esp-idf.git ~/esp/esp-idf" } }
        detail: |
          It takes about 2 GB, where the scripts look first. The tag is `PINNED_IDF_VERSION` in `moondeck/build/build_esp32.py`; setup moves a checkout that drifted from it.
      - id: long-paths
        say: Turn on Git's long paths.
        given: [{ input: platform, equals: Windows }]
        when: { run: { command: "git config --global core.longpaths true" } }
        detail: |
          The IDF's tooling nests deeply, and without long paths the clone trips Windows' 260-character limit.
      - id: clone-windows
        say: Clone ESP-IDF into your profile's esp folder.
        given: [{ input: platform, equals: Windows }]
        when: { run: { command: "git clone --depth 1 --recursive --shallow-submodules --branch <PINNED_IDF_VERSION> https://github.com/espressif/esp-idf.git \"$env:USERPROFILE\\esp\\esp-idf\"" } }
        detail: |
          The tag is `PINNED_IDF_VERSION` in `moondeck/build/build_esp32.py`.
      - id: setup
        say: Set up the IDF's environment and toolchains.
        when: { run: { script: moondeck/build/setup_esp_idf.py } }
        detail: |
          It takes about 1.5 GB more.

          It runs the upstream installer for the host, `install.sh` or `install.bat`; on Windows that takes about five minutes on a fast link. It also offers to move a drifted checkout onto the pin. The ESP32-S31, a preview target, needs its RISC-V toolchain fetched once more: `./install.sh esp32s31` in `~/esp/esp-idf`, or `install.bat esp32s31` on Windows.
      - id: build
        section: Each change
        say: Build the firmware for your board.
        when: { run: { script: moondeck/build/build_esp32.py, args: "--firmware <firmware>" } }
        detail: |
          Pick the variant for your board in MoonDeck's Firmware menu, or pass its key. Build one firmware at a time: the variants share their managed components, so two builds at once corrupt each other. Iterate on the one board that runs the change; the other chip families build at the commit check. After an sdkconfig or toolchain change, compile for real rather than trusting a freshness check. A MoonBase variant also builds MoonBase: [MoonBase and the partition layout](reference/build-system.md#moonbase-and-the-partition-layout).
      - id: port
        say: Find the board's serial port.
        when: { manual: "MoonDeck's Port dropdown lists the ports it sees; on Windows it is a COM name." }
        detail: |
          Ports drift between sessions, so read it again each session rather than from memory.
      - id: flash
        say: Flash it over USB.
        when: { run: { script: moondeck/build/flash_esp32.py, args: "--firmware <firmware> --port <port>" } }
        detail: |
          Use the Flash card with the port picked, or the script. Confirm the flash size with esptool's `flash_id` rather than a registry, since a variant built for another size boot-loops. On Windows the port is a `COM` name, and no port at all means a missing driver: [Install the USB-serial driver on Windows](moonwalk.md#windows-serial-drivers). The web installer flashes the same images, the S31 included.
      - id: monitor
        say: Watch its log over USB.
        when: { run: { script: moondeck/run/monitor_esp32.py, args: "--port <port>" } }
        detail: |
          Use the Monitor card, or the script.

          A silent reset is a hardware question before a software one. A watchdog reset with no panic, both CPUs stopped and the program counter inside the panic handler mean the flash cache is gone. That is a pin fault far more often than a code fault, so check the package before theorizing about the code. Reset a native-USB board (`/dev/cu.usbmodem*`) through esptool's hard reset rather than by toggling DTR and RTS, which its ROM reads as a boot-mode command.
  - id: ota-board
    title: Update a running board over the network
    actor: contributor
    goal: New firmware on a board with no cable.
    systems: [MoonDeck, MoonBase]
    dependsOn: [esp32-build-flash]
    intro: |
      A board cannot rewrite the partition it runs from, so on a variant with [MoonBase](explanation/architecture/moonbase.md) the app hands over to MoonBase, which does the writing. A partition-table change still needs a cable: [MoonBase and the partition layout](reference/build-system.md#moonbase-and-the-partition-layout).
    inputs:
      type: object
      properties:
        moonbase: { type: string, enum: [With MoonBase, Without MoonBase], description: "Does the board's variant carry MoonBase?" }
    steps:
      - id: install-moonbase
        say: Install MoonBase from the app.
        given: [{ input: moonbase, equals: With MoonBase }]
        when: { run: { command: "curl -X POST --http1.1 -H \"Expect:\" --data-binary @build/moonbase-<chip>/MoonLight-moonbase.bin http://<device>/api/firmware/moonbase-update" } }
        detail: |
          Once, on a board that has none yet.
      - id: to-moonbase
        say: Reboot the app into MoonBase.
        given: [{ input: moonbase, equals: With MoonBase }]
        when: { run: { command: "curl -X POST http://<device>/api/firmware/moonbase" } }
        detail: |
          It is back in about four seconds.
      - id: upload
        say: Send the app image.
        when: { run: { command: "curl --http1.1 -H \"Expect:\" --data-binary @build/esp32-<firmware>/MoonLight.bin http://<device>/api/firmware/upload" } }
        detail: |
          The request ends with no HTTP status (curl reports 000): the device reboots into the new image as the write completes. That is success. Without MoonBase the app takes the image itself on the same route.

          **413** means the request reached the app rather than MoonBase, which did not take over; `GET /moonbase` tells them apart. **`incomplete request body`** means the body did not arrive in time: send with `--http1.1 -H "Expect:"`, so it starts without waiting for a `100 Continue`. On a weak WiFi link a pushed image can abort; install by URL instead, `POST /api/firmware/url` with the address of a [served image](../moondeck/MoonDeck.md#serve_firmware) as `{"url": ...}`, and the board downloads it itself.
      - id: confirm
        say: Read the new build back.
        when: { run: { command: "curl -s http://<device>/api/modules/Firmware" } }
        detail: |
          The `build` control names the commit and the date.
  - id: provision-board
    title: Provision a freshly flashed board
    actor: contributor
    goal: A flashed board joins WiFi, carries its name and its device model's module tree.
    systems: [MoonDeck]
    dependsOn: [esp32-build-flash]
    intro: |
      A flashed board listens for Improv over USB-serial. One run pushes the WiFi credentials and, when you name the device model, its TX-power cap and module tree. The option tables are in [MoonDeck](../moondeck/MoonDeck.md#improv_provision).
    steps:
      - id: port
        say: Confirm the board answers on its port.
        when: { run: { script: moondeck/build/improv_probe.py, args: "--port <port>" } }
        detail: |
          The port is the one MoonDeck's Port dropdown shows, or the device's `last_port` in `moondeck/moondeck.json`; ports drift between sessions. Never open a bench port with a bare serial library. Opening it asserts the reset lines on many boards and reboots them, which also fabricates boot chatter that looks like a fault. Use the MoonDeck scripts, and attach a monitor before the event you want to see, never after.
      - id: provision
        say: Provision WiFi and the device model.
        when: { run: { script: moondeck/build/improv_provision.py, args: "--port <port> --device-model \"<Name>\"" } }
        detail: |
          `--device-model` takes a name from `mooninstaller/deviceModels.json`. It pushes the TX-power cap before the credentials, then the credentials, then the model's state document, including `System.deviceModel`. Without it only WiFi is set and the module tree, such as the LED driver and its `pins`, stays empty.

          The credentials come from the active network in `moondeck/moondeck.json`, else from the WiFi the host has joined. `--ssid` and `--password` override both. `--tx-power <dBm>` sets the cap without a catalog entry; weak-powered boards need 8.
      - id: joined
        say: Check it printed the device URL.
        when: { manual: "The run exits 0 and prints `==> provisioned: http://<ip>/`." }
        detail: |
          A timeout means the board did not answer: check the port, then power-cycle it. The run waits 45 seconds by default.
      - id: reach
        say: Open the board's page.
        when: { open: { url: "http://<ip>/" } }
        detail: |
          When the model's LED pins include GPIO 1 or 3, the driver claims the UART pins and serial stops receiving. The push is one way, so changing such a board, a QuinLED for one, goes through this page.
      - id: smoke
        say: Run the smoke test after provisioning changes.
        given: [{ changed: ["moondeck/build/improv_*.py", "src/core/util/ImprovOpReassembler.h", "src/platform/esp32/platform_esp32_improv.cpp", "mooninstaller/**"] }]
        when: { run: { script: moondeck/build/improv_smoke_test.py, args: "--port <port>" } }
        detail: |
          It probes the board, provisions it and fetches its page.
    outro: |
      The board is on the network under its name with its modules in place. Continue with [Build, flash and monitor an ESP32](moonwalk.md#esp32-build-flash) for the next change.
  - id: teensy
    title: Build, flash and monitor a Teensy
    actor: contributor
    goal: A Teensy 4.1 runs the change.
    systems: [MoonDeck]
    dependsOn: [desktop-build-test]
    intro: |
      One firmware, `teensy41`, uses the board's own Ethernet, or a W5500 module on the 4.1-NE, which has none, found at boot. Pins, wiring and power: [the Teensy 4.1 page](reference/hardware/teensy-4-1.md).
    steps:
      - id: seat
        section: Once per board
        say: Seat the boards, then the wires, GND first.
        when: { manual: "With everything unpowered." }
        detail: |
          The wiring tables are on [the Teensy 4.1 page](reference/hardware/teensy-4-1.md#an-example-setup-on-a-breadboard).
      - id: rail
        say: Bridge the bottom rail across its gap.
        when: { manual: "Check whether the rail is split at column 30, where its printed lines break." }
        detail: |
          If it is, bridge both − and + across the gap: the Teensy feeds the rail at column 26 and the W5500 draws at column 54.
      - id: jumpers
        say: Keep both MB102 rail jumpers off.
        when: { manual: "Otherwise the MB102 and the Teensy drive one 3.3 V net from two regulators." }
      - id: power
        say: Plug in USB.
        when: { manual: "The W5500's link LEDs light once the cable is in." }
      - id: setup
        section: Build and flash
        say: Fetch the SDK into ~/teensy, once.
        when: { run: { script: moondeck/build/setup_teensy.py } }
      - id: build
        say: Build it, to build/teensy41/MoonLight.hex.
        when: { run: { script: moondeck/build/build_teensy.py } }
      - id: flash
        say: Flash it over USB, with no button press.
        when: { run: { script: moondeck/build/flash_teensy.py } }
        detail: |
          The device boots and the strip lights.
      - id: monitor
        say: Watch its log over USB serial.
        when: { run: { script: moondeck/run/monitor_teensy.py } }
        detail: |
          Settings live in 1 MB of the program flash and survive a flash and a network update. A running board also updates over the network, the `.bin` uploaded on the Firmware card or to `/api/firmware/upload`. Each release carries the image as `firmware-teensy41-v<version>.hex` for PJRC's Teensy app or `teensy_loader_cli`, and as a `.bin` for the network update and the web installer.
