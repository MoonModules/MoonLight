# yaml-language-server: $schema=moonwalk.schema.json
stage: Contribute
summary: From a picked topic to a measured, reviewed commit.
processes:
  - id: pick-spec-plan
    title: Pick, spec and plan a topic
    actor: product-owner
    goal: A module, effect, driver or capability has an approved plan before code.
    systems: [MoonWalk]
    page: contributing/principles-and-process.md
  - id: branch
    title: Branch and work on it
    actor: product-owner
    goal: Feature work lands on a branch the product owner created, and main stays releasable.
    dependsOn: [pick-spec-plan]
  - id: build-setup
    title: Set up a computer to build MoonLight
    actor: contributor
    goal: uv, CMake 3.20 or newer and a C++20 compiler on the machine, once.
    systems: [MoonDeck]
    inputs:
      type: object
      properties:
        platform: { type: string, enum: [macOS, Linux, Windows], description: "Which computer?" }
    steps:
      - id: mac
        say: Install the command line tools, then CMake and uv.
        given: [{ input: platform, equals: macOS }]
        when: { run: { command: "xcode-select --install && brew install cmake uv" } }
      - id: linux
        say: Install CMake and GCC 12 or Clang 15 from your distribution, and uv from astral's installer.
        given: [{ input: platform, equals: Linux }]
        when: { manual: "sudo apt install cmake g++, then curl -LsSf https://astral.sh/uv/install.sh | sh" }
      - id: windows
        say: Install CMake and the Visual Studio 2022 Build Tools with the MSVC v143 workload and the Windows 11 SDK, from an elevated terminal.
        given: [{ input: platform, equals: Windows }]
        when: { run: { command: "winget install Kitware.CMake; winget install Microsoft.VisualStudio.2022.BuildTools --override \"--passive --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended\"" } }
        detail: |
          Build and test from a **Developer PowerShell for VS 2022**, so `cl.exe` and the SDK are on `PATH`. Install uv from astral's installer as well.
      - id: moondeck
        say: Start MoonDeck and open it in the browser.
        when: { run: { command: "uv run moondeck/moondeck.py" } }
        detail: |
          It serves at `http://localhost:8420`. Every step below is one of its cards, and the same scripts run from a terminal.
  - id: setup-editor
    title: Set up the editor
    actor: contributor
    goal: Diagnostics appear as you type, from the same `.clang-tidy` CI uses.
    systems: [MoonDeck]
    dependsOn: [build-setup]
    steps:
      - id: clangd
        say: Install the clangd extension, and turn off Microsoft's C/C++ IntelliSense.
        when: { manual: "llvm-vs-code-extensions.vscode-clangd; the two together report every diagnostic twice, and disagree." }
        detail: |
          Nothing else to configure: `.clangd` points at the compilation database, and any build refreshes it, since `CMakeLists.txt` sets `CMAKE_EXPORT_COMPILE_COMMANDS`. clangd skips the checks it counts as slow, so CI stays the authority.
      - id: build-once
        say: Build the desktop once, which writes the compilation database clangd reads.
        when: { run: { script: moondeck/build/build_desktop.py } }
        detail: |
          **Every file reports `'cstdint' file not found`?** The build directory was configured with another compiler than clangd uses. `.clangd`'s `--query-driver` covers the usual ones; add a new toolchain there.
  - id: bump-idf
    title: Bump the ESP-IDF pin
    actor: contributor
    goal: Every ESP32 target builds on the new IDF, locally and in CI.
    systems: [MoonDeck]
    intro: |
      A pin move is a deliberate re-test pass, never a routine pull. What the pin is and why: [ESP-IDF version](reference/build-system.md#esp-idf-version).
    steps:
      - id: pins
        say: Move the pin in setup_esp_idf.py, and the Docker tag and its cache key in the release workflow.
        when: { manual: "PINNED_IDF_COMMIT and PINNED_IDF_VERSION; esp_idf_version in .github/workflows/release.yml." }
      - id: checkout
        say: Check the new tag out with its submodules, and set the toolchain up again.
        when: { run: { script: moondeck/build/setup_esp_idf.py } }
        detail: |
          Check out with `--recursive`: a different IDF commit without its submodules builds against the old ones.
      - id: build-all
        say: Build every ESP32 firmware, one at a time.
        when: { manual: "build_esp32.py --firmware <name>, once per variant." }
      - id: retest
        say: Re-test on a board of each chip family, then commit the bump.
        when: { manual: "A classic, an S3, an S31 and a P4, with the device scenarios." }
  - id: desktop-build-test
    title: Build, run and test on the desktop
    actor: contributor
    goal: A change is proven on the host before any board build.
    systems: [MoonDeck]
    dependsOn: [branch, build-setup]
    intro: |
      Desktop first, always: anything the desktop can prove, the user interface, the logic and the tests, is proven there rather than through a multi-minute compile and a flash. Desktop and Raspberry Pi build from the same root `CMakeLists.txt`, natively or cross-compiled. Where each build writes: [Build directories](reference/build-system.md#build-directories).
    steps:
      - id: build
        say: Build the desktop firmware, with zero warnings.
        when: { run: { script: moondeck/build/build_desktop.py } }
      - id: run
        say: Run it; a second run replaces the instance already running.
        when: { run: { script: moondeck/run/run_desktop.py } }
        detail: |
          The run detaches and outlives the script that started it, as a flashed board runs on its own. Open `http://localhost:8080`. A source checkout keeps its settings in `build/fs/`: [where the desktop keeps its settings](reference/build-system.md#where-the-desktop-keeps-its-settings).
      - id: build-tests
        say: Build the unit tests and the scenario runner.
        when: { run: { script: moondeck/build/build_desktop.py, args: "--tests" } }
      - id: test
        say: Run the unit tests.
        when: { run: { script: moondeck/test/test_desktop.py } }
      - id: scenarios
        say: Replay the scenarios in-process.
        when: { run: { script: moondeck/scenario/run_scenario.py } }
  - id: package-desktop
    title: Package the desktop build
    actor: contributor
    goal: The installable files for the host it runs on.
    systems: [MoonDeck]
    dependsOn: [desktop-build-test]
    steps:
      - id: package
        say: Build and package for this host.
        when: { run: { script: moondeck/ci/package_desktop.py } }
        detail: |
          A `.dmg` holding a `.app` on macOS, a `.tar.gz` and a `.deb` on Linux, a `.zip` and an NSIS `-setup.exe` on Windows. The Windows setup installs into `%LOCALAPPDATA%\Programs\MoonLight` with a Start-menu entry and an uninstaller, needs no administrator, and never touches the settings folder, so an upgrade keeps the user's configuration.

          The Windows icon and the macOS `.icns` both derive from `mooninstaller/favicon.png`; the `.ico` is generated in the CMake build (`moondeck/ci/make_ico.py`) and embedded in the executable. A packager skips its format when its tool is missing (`dpkg-deb`, `makensis`) on a development machine. It fails outright in CI, where a missing file would otherwise fail the release on a glob.
  - id: esp32-build-flash
    title: Build, flash and monitor an ESP32
    actor: contributor
    goal: A bench board runs the change the desktop could not prove.
    systems: [MoonDeck]
    dependsOn: [desktop-build-test]
    intro: |
      ESP-IDF directly, not the Arduino framework, at the pinned [ESP-IDF version](reference/build-system.md#esp-idf-version). The firmware variants and their keys: [Firmware variants](reference/build-system.md#firmware-variants).
    inputs:
      type: object
      properties:
        platform: { type: string, enum: [macOS, Linux, Windows], description: "Which computer?" }
    steps:
      - id: clone
        section: Once per machine
        say: Clone ESP-IDF, about 2 GB, into ~/esp/esp-idf, where the scripts look first.
        given: [{ input: platform, in: [macOS, Linux] }]
        when: { run: { command: "git clone --depth 1 --branch v6.1 https://github.com/espressif/esp-idf.git ~/esp/esp-idf" } }
      - id: clone-windows
        say: Turn on long paths, then clone ESP-IDF into your profile's esp folder.
        given: [{ input: platform, equals: Windows }]
        when: { run: { command: "git config --global core.longpaths true; git clone --depth 1 --branch v6.1 https://github.com/espressif/esp-idf.git \"$env:USERPROFILE\\esp\\esp-idf\"" } }
        detail: |
          The IDF's tooling nests deeply, and without long paths the clone trips Windows' 260-character limit.
      - id: setup
        say: Set the IDF's Python environment and toolchains up, about 1.5 GB more.
        when: { run: { script: moondeck/build/setup_esp_idf.py } }
        detail: |
          It runs the upstream installer for the host, `install.sh` or `install.bat`; on Windows that takes about five minutes on a fast link. It also offers to move a drifted checkout onto the pin. The ESP32-S31, a preview target, needs its RISC-V toolchain fetched once more: `cd ~/esp/esp-idf && ./install.sh esp32s31`.
      - id: build
        section: Each change
        say: Build the firmware for your board.
        when: { run: { script: moondeck/build/build_esp32.py, args: "--firmware esp32" } }
        detail: |
          Pick the variant for your board in MoonDeck's Firmware menu, or pass its key. A MoonBase variant also builds MoonBase: [MoonBase and the partition layout](reference/build-system.md#moonbase-and-the-partition-layout).
      - id: flash
        say: Flash it over USB.
        when: { manual: "flash_esp32.py --firmware <name> --port <port>, or the Flash card with the port picked." }
        detail: |
          On Windows the port is a `COM` name, and no port at all means a missing driver: [Install the USB-serial driver on Windows](moonwalk.md#windows-serial-drivers). The web installer flashes the same images, the S31 included.
      - id: monitor
        say: Watch its log over USB.
        when: { manual: "monitor_esp32.py --port <port>, or the Monitor card." }
  - id: ota-board
    title: Update a running board over the network
    actor: contributor
    goal: New firmware on a board with no cable.
    systems: [MoonDeck, MoonBase]
    dependsOn: [esp32-build-flash]
    intro: |
      A board cannot rewrite the partition it runs from, so on a variant with [MoonBase](explanation/architecture/moonbase.md) the app hands over to MoonBase, which does the writing. A partition-table change still needs a cable: [MoonBase and the partition layout](reference/build-system.md#moonbase-and-the-partition-layout).
    inputs:
      type: object
      properties:
        moonbase: { type: string, enum: [With MoonBase, Without MoonBase], description: "Does the board's variant carry MoonBase?" }
    steps:
      - id: to-moonbase
        say: Reboot the app into MoonBase, which is back in about four seconds.
        given: [{ input: moonbase, equals: With MoonBase }]
        when: { run: { command: "curl -X POST http://<device>/api/firmware/moonbase" } }
      - id: upload
        say: Send the app image.
        when: { run: { command: "curl --http1.1 -H \"Expect:\" --data-binary @build/esp32-<firmware>/MoonLight.bin http://<device>/api/firmware/upload" } }
        detail: |
          The request ends with no HTTP status (curl reports 000): the device reboots into the new image as the write completes. That is success. Without MoonBase the app takes the image itself on the same route, one of two that stream a body larger than the request buffer.

          **413** means the request reached the app rather than MoonBase, which did not take over; `GET /moonbase` tells them apart. **`incomplete request body`** means the body did not arrive in time: send with `--http1.1 -H "Expect:"`, so it starts without waiting for a `100 Continue`. On a weak WiFi link a pushed image can abort; install by URL instead, `POST /api/firmware/url` with the address of a [served image](../moondeck/MoonDeck.md#serve_firmware) as `{"url": ...}`, and the board downloads it itself.
      - id: confirm
        say: Read the new build back.
        when: { run: { command: "curl -s http://<device>/api/modules/Firmware" } }
        detail: |
          The `build` control names the commit and the date.
  - id: provision-board
    title: Provision a freshly flashed board
    actor: contributor
    goal: A flashed board joins WiFi, carries its name and its device model's module tree.
    systems: [MoonDeck]
    dependsOn: [esp32-build-flash]
  - id: teensy
    title: Build, flash and monitor a Teensy
    actor: contributor
    goal: A Teensy 4.1 runs the change.
    systems: [MoonDeck]
    dependsOn: [desktop-build-test]
    intro: |
      One firmware, `teensy41`, uses the board's own Ethernet, or a W5500 module on the 4.1-NE, which has none, found at boot. Pins, wiring and power: [the Teensy 4.1 page](reference/hardware/teensy-4-1.md).
    steps:
      - id: setup
        say: Fetch the SDK into ~/teensy, once.
        when: { run: { script: moondeck/build/setup_teensy.py } }
      - id: build
        say: Build it, to build/teensy41/MoonLight.hex.
        when: { run: { script: moondeck/build/build_teensy.py } }
      - id: flash
        say: Flash it over USB, with no button press.
        when: { run: { script: moondeck/build/flash_teensy.py } }
      - id: monitor
        say: Watch its log over USB serial.
        when: { run: { script: moondeck/run/monitor_teensy.py } }
        detail: |
          Settings live in 1 MB of the program flash and survive a flash and a network update. A running board also updates over the network, the `.bin` uploaded on the Firmware card or to `/api/firmware/upload`. Each release carries the image as `firmware-teensy41-v<version>.hex` for PJRC's Teensy app or `teensy_loader_cli`, and as a `.bin` for the network update and the web installer.
  - id: iterate-moonlive
    title: Iterate a MoonLive script on a board
    actor: agent
    goal: A script is edited and judged on the device before it lands in the repo.
    systems: [MoonLive]
  - id: add-test
    title: Add a test, and pin a bug
    actor: contributor
    goal: New behavior and every fixed defect are pinned by a test.
    systems: [MoonDeck]
    page: reference/testing.md
  - id: run-scenario
    title: Run a scenario in-process on the desktop
    actor: contributor
    goal: One scenario replays against a scheduler inside the test binary and records what each step costs.
    systems: [MoonDeck]
    page: reference/testing.md
  - id: run-live-scenario
    title: Run a scenario against a live device
    actor: contributor
    goal: The same scenario over REST against a running desktop or board, leaving the device as found.
    systems: [MoonDeck]
    page: reference/testing.md
  - id: live-verification
    title: Run a live verification on boards
    actor: contributor
    goal: The bench boards confirm what the desktop cannot measure.
    systems: [MoonDeck]
    page: reference/testing.md
  - id: renegotiate-contract
    title: Renegotiate a performance contract
    actor: contributor
    goal: A scenario's contract moves with a stated reason.
    systems: [MoonDeck]
    page: reference/testing.md
  - id: perform-clip
    title: Perform a clip as a UI test
    actor: contributor
    goal: The UI does what every published clip shows.
    systems: [MoonTube]
    page: reference/testing.md
  - id: film-clip
    title: Record a MoonTube clip
    actor: product-owner
    goal: A narrated clip under docs/assets/moontube, cut into a series.
    systems: [MoonTube]
  - id: document
    title: Document a change
    actor: contributor
    goal: The module's header and the docs describe what shipped.
    page: contributing/documentation-standards.md
  - id: commit
    title: Run the commit checks, then commit
    actor: contributor
    goal: A commit whose every check the change triggers passed, reviewed and measured.
    systems: [MoonDeck]
    dependsOn: [desktop-build-test, document]
    page: contributing/principles-and-process.md
    intro: |
      Each check runs when the change touches its paths, and once: a pass counts until the files it covers change again. The product owner commits in this role too.
    steps:
      - id: specs
        section: Every change
        say: Check the specs.
        when: { run: { script: moondeck/check/check_specs.py } }
      - id: prose
        say: Check the prose of the added lines.
        when: { run: { script: moondeck/check/check_prose.py } }
        detail: |
          It also writes its report to the tree, a record the commit carries.
      - id: docs
        section: Documentation
        say: Build the docs, strict.
        given: [{ changed: ["**/*.md", mkdocs.yml, moonwalk/**] }]
        when: { run: { script: moondeck/docs/build_docs.py, args: "--strict" } }
      - id: docgen
        say: Check the documentation in the headers against the ratchet.
        given: [{ changed: ["**/*.md", src/**, test/**] }]
        when: { run: { script: moondeck/check/check_docgen.py } }
      - id: taglines
        say: Check the front pages agree on the platforms.
        given: [{ changed: [README.md, docs/index.md, CLAUDE.md] }]
        when: { run: { script: moondeck/check/check_taglines.py } }
      - id: code
        section: Code
        say: Check the code's boundaries and complexity.
        given: [{ changed: [src/**, test/**, "!test/js/**", "!test/python/**"] }]
        when: { run: { script: moondeck/check/check_code.py } }
      - id: build-desktop
        say: Build the desktop firmware, with zero warnings.
        given: [{ changed: [src/**, test/**, "!test/js/**", "!test/python/**"] }]
        when: { run: { script: moondeck/build/build_desktop.py } }
      - id: build-tests
        say: Build the unit tests and the scenario runner.
        given: [{ changed: [src/**, test/**, "!test/js/**", "!test/python/**"] }]
        when: { run: { script: moondeck/build/build_desktop.py, args: "--tests" } }
      - id: test-desktop
        say: Run the unit tests.
        given: [{ changed: [src/**, test/**, "!test/js/**", "!test/python/**"] }]
        when: { run: { script: moondeck/test/test_desktop.py } }
      - id: scenarios
        say: Run the scenarios the change touches.
        given: [{ changed: [src/**, test/**, "!test/js/**", "!test/python/**"] }]
        when: { run: { script: moondeck/scenario/run_scenario.py } }
        detail: |
          Select by `--module` or `--name` rather than refreshing every scenario. A run writes its observation blocks back into the scenario files.
      - id: esp32-fresh
        say: Check the classic ESP32 firmware is newer than its sources, and rebuild it on the product owner's go when it is not.
        given: [{ changed: [src/**, "!src/platform/desktop/**"] }]
        when: { run: { script: moondeck/check/check_esp32_built.py, args: "--firmware esp32" } }
        detail: |
          One firmware per chip family is the gate: this one, the S3's and the P4's. A stale one is rebuilt with `build_esp32.py --firmware <name>`, one at a time, since the variants share their managed components. The check compares the binary against every source in a tenth of a second and catches the edit that was never compiled.
      - id: esp32-fresh-s3
        say: The same for the S3 firmware.
        given: [{ changed: [src/**, "!src/platform/desktop/**"] }]
        when: { run: { script: moondeck/check/check_esp32_built.py, args: "--firmware esp32s3-n16r8" } }
      - id: esp32-fresh-p4
        say: The same for the P4 firmware.
        given: [{ changed: [src/**, "!src/platform/desktop/**"] }]
        when: { run: { script: moondeck/check/check_esp32_built.py, args: "--firmware esp32p4rev3-eth" } }
      - id: no-jit
        say: Build the desktop without the MoonLive backend.
        given: [{ changed: [src/core/moonlive/**] }]
        when: { run: { script: moondeck/build/build_desktop.py, args: "--no-jit" } }
        detail: |
          It catches a helper left unused outside its guard, fatal under GCC while clang stays silent.
      - id: kpi
        say: Record the repo's health, and put its deltas in the commit message.
        given: [{ changed: [src/**, test/**, "!test/js/**", "!test/python/**"] }]
        when: { run: { script: moondeck/check/collect_kpi.py, args: "--commit" } }
        detail: |
          Flash and DRAM per target, binary size, the tick matrix, line counts and complexity. It runs when the code changes, since its timings drift with the host.
      - id: js
        section: The web pages
        say: Run the JavaScript tests.
        given: [{ changed: [src/ui/**, mooninstaller/**, docs/assets/**, test/js/**] }]
        when: { run: { script: moondeck/test/test_host.py, args: "--js" } }
      - id: devices
        say: Check the installer's device catalog.
        given: [{ changed: [src/ui/**, mooninstaller/**] }]
        when: { run: { script: moondeck/check/check_devices.py } }
      - id: python
        section: The scripts
        say: Run the Python tests.
        given: [{ changed: [moondeck/**, moonlive/**, moonwalk/**, test/python/**, "docs/moonmodules/**/*.md"] }]
        when: { run: { script: moondeck/test/test_host.py, args: "--python" } }
      - id: firmwares
        say: Check the firmware list.
        given: [{ changed: [moondeck/**, moonlive/**] }]
        when: { run: { script: moondeck/check/check_firmwares.py } }
      - id: improv
        section: With a board attached
        say: Provision a board over Improv, end to end.
        given: [{ changed: ["src/**/*Improv*", "src/platform/*/platform_*_improv.cpp", mooninstaller/improv-frame.js, mooninstaller/install-orchestrator.js, "moondeck/build/improv_*.py"] }]
        when: { manual: "improv_smoke_test.py --port <the board's port>, or its card with the port picked." }
        detail: |
          Recommended rather than required, since it needs a board on USB; a skip names its reason.
      - id: stage
        section: Commit
        say: Read the diff and stage what you reviewed.
        when: { manual: "Staged means read." }
      - id: commit
        say: Commit, with the deltas the health check printed.
        when: { run: { command: "git commit" } }
        detail: |
          The message carries the performance line and the account line from `collect_kpi.py --commit`.
