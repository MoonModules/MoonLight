# yaml-language-server: $schema=moonwalk.schema.json
stage: Document and commit
summary: The change documented, checked and committed.
processes:
  - id: document
    title: Document a change
    actor: contributor
    goal: The module's header and the docs describe what shipped.
    page: contributing/documentation-standards.md
    intro: |
      Docs land with the code and describe the system as it is. A fact lives in one place and every other page links to it. Where each kind of text goes: [What we document](contributing/documentation-standards.md#what-we-document).
    steps:
      - id: header
        say: Describe what shipped in the module's header.
        when: { manual: "A fact about behavior goes in the .h, beside the code." }
        detail: |
          The header is the module's own documentation and feeds its catalog card. Write `///` comments as [Comments](contributing/documentation-standards.md#comments) says: one line above the code it explains.
      - id: page
        say: Write intent, cost and sequence on a page.
        when: { manual: "A task goes in a MoonWalk process under moonwalk/; a why under docs/explanation/, a fact under docs/reference/." }
        detail: |
          A fact about intent, cost or sequence has no member to sit on. The folder is the type, and a page serves one kind only: [What we document](contributing/documentation-standards.md#what-we-document).
      - id: migrating
        say: Add a MIGRATING entry for a breaking change.
        when: { read: { page: reference/MIGRATING.md } }
        detail: |
          A break is documented rather than carried. The entry buys one way to do each thing.
      - id: delete
        say: Close the shipped card.
        when: { manual: "A card a pull request ships without a plan moves to Done on the Project; a card a plan absorbed is gone already, and the plan closes as an issue." }
    outro: |
      The docs build and the documentation checks run with [the commit checks](moonwalk.md#commit). The merge gate verifies the docs landed with the code.
  - id: commit
    title: Run the commit checks, then commit
    actor: contributor
    goal: A commit whose every check the change triggers passed, reviewed and measured.
    systems: [MoonDeck]
    dependsOn: [desktop-build-test, document]
    page: contributing/principles-and-process.md
    intro: |
      The product owner initiates every event and every gate list. On "run pre-commit", run each check the change triggers, once. Report one line each, PASS, FAIL or SKIP with the reason, and stop. An applicable check skipped carries a one-line reason in the commit or pull request. A failure is reported, not fixed and rerun: a second run needs the words again.

      The scope freezes at the words: a request made during a run goes to the next commit. The product owner can bring one in, such as an edit to a file already in the diff that triggers no new check. After a run, a change re-checks only itself on the product owner's go, a cosmetic one rides along, and "restart" reruns everything. `test_host --ui` is never a gate.
    steps:
      - id: reviewer
        say: Have the Reviewer read the staged diff.
        actor: agent
        when: { manual: "First, on about ten files across areas or on request: every check waits until its findings are processed." }
        detail: |
          A review finding changes the diff, and a check run before it would have to run again: the Reviewer first is what lets every check run once. Its findings are processed as [Process a review finding](moonwalk.md#review-finding) says.
      - id: specs
        section: Every change
        say: Check the specs.
        when: { run: { script: moondeck/check/check_specs.py } }
      - id: prose
        say: Check the prose of the added lines.
        when: { run: { script: moondeck/check/check_prose.py } }
        detail: |
          It also writes its report to the tree, a record the commit carries.
      - id: docs
        section: By what the change touches
        say: Run the docs checks.
        when: { process: commit-docs }
      - id: code
        say: Run the code checks.
        when: { process: commit-code }
      - id: web
        say: Run the web page checks.
        when: { process: commit-web }
      - id: scripts
        say: Run the script checks.
        when: { process: commit-scripts }
      - id: improv
        section: With a board attached
        say: Provision a board over Improv, end to end.
        given: [{ changed: ["src/**/*Improv*", "src/platform/*/platform_*_improv.cpp", mooninstaller/improv-frame.js, mooninstaller/install-orchestrator.js, "moondeck/build/improv_*.py"] }]
        when: { run: { script: moondeck/build/improv_smoke_test.py, args: "--port <port>" } }
        detail: |
          Or its card with the port picked. Recommended rather than required, since it needs a board on USB; a skip names its reason.
      - id: stage
        section: Commit
        actor: product-owner
        say: Stage the diff you reviewed.
        when: { manual: "Staged means read, unstaged means not." }
        detail: |
          The agent never stages or unstages: staging claims something as reviewed that nobody read, and unstaging discards a verification invisibly. A scratch file of the agent's that lands in the index is reported rather than quietly removed. A tracked file is deleted with plain `rm`, since `git rm` stages the deletion. Never `git stash`: a conflicted pop stages every change, and a before number comes from the committed reports or `git show HEAD:<path>`.
      - id: commit
        actor: product-owner
        say: Commit on the words "commit now".
        when: { run: { command: "git commit" } }
        detail: |
          Only "commit now" commits, and it covers the diff the product owner reviewed: any later edit voids it.

          The message opens with an imperative title of at most 72 characters and a 1 to 3 sentence end-user summary with no file lists. Then the performance line and the account line from `collect_kpi.py --commit`. Then bullets under **Core**, **Light domain**, **UI**, **Scripts/MoonDeck**, **Tests**, **Docs/CI** and **Reviews**, with one Reviews bullet per finding: flagged, then done, accepted or deferred, and why. No hard wraps.
  - id: commit-docs
    title: The docs checks
    actor: contributor
    goal: Every documentation check the change triggers passed.
    steps:
      - id: docs
        say: Build the docs, strict.
        given: [{ changed: ["**/*.md", "docs/**", mkdocs.yml, moonwalk/**, "moondeck/docs/**"] }]
        when: { run: { script: moondeck/docs/build_docs.py, args: "--strict" } }
      - id: docgen
        say: Check the headers' documentation.
        given: [{ changed: ["**/*.md", src/**, test/**] }]
        when: { run: { script: moondeck/check/check_docgen.py } }
        detail: |
          A ratchet against the counts committed in `docs/reference/metrics/docgen.json`, per rule and in total: [check_docgen](../moondeck/MoonDeck.md#check_docgen).
      - id: backlog
        say: Check the backlog matches the Project.
        when: { run: { script: moondeck/report/project_mirror.py, args: "--check" } }
        detail: |
          The cards are the backlog's home and `docs/work/backlog_mirror/` their generated copy, so the repository versions every card edit. A FAIL means a card changed since the last render or a file was edited by hand: run the script without `--check` and stage what it writes. Without a network it skips.
      - id: taglines
        say: Check the front pages agree on the platforms.
        given: [{ changed: [README.md, CLAUDE.md] }]
        when: { run: { script: moondeck/check/check_taglines.py } }
  - id: commit-code
    title: The code checks
    actor: contributor
    goal: Every code check the change triggers passed, and the repo's health is recorded.
    steps:
      - id: code
        say: Check the code's boundaries and complexity.
        given: [{ changed: [src/**, test/**, "!test/js/**", "!test/python/**"] }]
        when: { run: { script: moondeck/check/check_code.py } }
      - id: build-desktop
        say: Build the desktop firmware, with zero warnings.
        given: [{ changed: [src/**, test/**, "!test/js/**", "!test/python/**"] }]
        when: { run: { script: moondeck/build/build_desktop.py } }
      - id: tests
        say: Test the change on the desktop.
        given: [{ changed: [src/**, test/**, "!test/js/**", "!test/python/**"] }]
        when: { process: desktop-tests }
      - id: esp32-fresh
        say: Check the S3 firmware is up to date.
        given: [{ changed: [src/**, "!src/platform/desktop/**"] }]
        when: { run: { script: moondeck/check/check_esp32_built.py, args: "--firmware esp32s3-n16r8" } }
        detail: |
          It compares the binary against every source in a tenth of a second, and catches the edit that was never compiled. One firmware is the gate, the S3, since it compiles the most of the light domain (the panel cards and the LCD drivers the classic leaves out) and the release workflow builds every shipped variant. A change to an sdkconfig fragment, the executable-memory path or host-ISA code needs one firmware per chip family built, the variant that layers the changed fragments, since a family's variants compile the same code and differ only in their fragments; the rest wait for the release workflow. A stale one is rebuilt without asking, [one at a time](moonwalk.md#esp32-build-flash).
      - id: esp32-fresh-moonbase
        say: Check the classic firmware and MoonBase are current.
        given: [{ changed: [moonbase/**] }]
        when: { run: { script: moondeck/check/check_esp32_built.py, args: "--firmware esp32" } }
        detail: |
          The classic is the firmware that carries the MoonBase image, so a MoonBase change is checked there.
      - id: no-jit
        say: Build the desktop without the MoonLive backend.
        given: [{ changed: ["src/*/moonlive/**"] }]
        when: { run: { script: moondeck/build/build_desktop.py, args: "--no-jit" } }
        detail: |
          It catches a helper left unused outside its guard, fatal under GCC while clang stays silent.
      - id: kpi
        say: Record the repo's health.
        given: [{ changed: [src/**, test/**, "!test/js/**", "!test/python/**"] }]
        when: { run: { script: moondeck/check/collect_kpi.py, args: "--commit" } }
        detail: |
          Flash and DRAM per target, binary size, the tick matrix, line counts and complexity: its diff belongs in the commit and its deltas in the message. It runs when the code changes, since its timings drift with the host.
  - id: commit-web
    title: The web page checks
    actor: contributor
    goal: Every web page check the change triggers passed.
    steps:
      - id: js
        say: Run the JavaScript tests.
        given: [{ changed: [src/ui/**, mooninstaller/**, "docs/assets/*.js", test/js/**] }]
        when: { run: { script: moondeck/test/test_host.py, args: "--js" } }
      - id: devices
        say: Check the installer's device catalog.
        given: [{ changed: [src/ui/**, mooninstaller/**] }]
        when: { run: { script: moondeck/check/check_devices.py } }
  - id: commit-scripts
    title: The script checks
    actor: contributor
    goal: Every script check the change triggers passed.
    steps:
      - id: python
        say: Run the Python tests.
        given: [{ changed: [moondeck/**, moonlive/**, moonwalk/**, test/python/**, "docs/moonmodules/**/*.md"] }]
        when: { run: { script: moondeck/test/test_host.py, args: "--python" } }
      - id: firmwares
        say: Check the firmware list.
        given: [{ changed: [moondeck/**, moonlive/**] }]
        when: { run: { script: moondeck/check/check_firmwares.py } }
