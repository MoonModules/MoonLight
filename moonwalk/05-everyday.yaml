# yaml-language-server: $schema=moonwalk.schema.json
stage: Everyday use
summary: Looks, the gallery, hands-on control and the smart home.
processes:
  - id: presets
    title: Save, edit and apply a preset
    actor: user
    goal: A look, geometry, hardware or service setup recalled with one click.
    systems: [MoonCore]
    dependsOn: [first-light-show]
    page: how-to/presets.md
    intro: |
      A preset is a saved state brought back with one click: a look, a geometry or a hardware setup. They live on the Control card as a grid of 64 pads. What a preset holds and how applying one behaves: [Presets](how-to/presets.md).
    steps:
      - id: open
        section: Save one
        say: Open Control.
        when: { open: { module: ControlModule } }
      - id: editor
        say: Open an empty pad's editor.
        when: { manual: "Click an empty pad, or right-click a full one; on a touchscreen, press and hold it." }
      - id: save
        say: Save the current state on the pad.
        when: { manual: "Give it a name, pick its container and press save current state here." }
        detail: |
          Effects is a look, Layouts a geometry, Drivers a hardware setup, Services a service configuration. One container per save keeps a look portable: an Effects preset applies on any board, since it carries no pins.

          Any card saves itself too: its `{ }` button, a name and **save as preset** put that card alone on the first free pad.
      - id: apply
        section: Apply it
        say: Click the pad.
        when: { manual: "What it holds replaces what was there. One preset per container stays lit, so a layout and a look apply together." }
      - id: change
        section: Change it
        say: Open its editor.
        when: { manual: "Right-click the pad, or press and hold it." }
        detail: |
          - **What it holds:** apply it, change the cards, then press **save current state over it**.
          - **Its name:** edit **name**; it applies on Enter.
          - **Delete it:** press **delete preset**.
          - **Move it:** drag it onto another pad, which swaps the two.
  - id: gallery-install
    title: Install a preset or script from the gallery
    actor: user
    goal: Something shared lands on a pad or in /moonlive.
    systems: [MoonCore, MoonLive]
    page: how-to/presets.md
    intro: |
      The Gallery under the pads shows what people shared in [MoonLight-Gallery](https://github.com/MoonModules/MoonLight-Gallery). Your browser fetches it, so the device needs no internet of its own.
    steps:
      - id: open
        say: Open the Gallery under the pads.
        when: { open: { module: ControlModule } }
        detail: |
          Entries show most liked or newest first. Search covers the name, the description and the author, and a chip per kind narrows it to presets or one kind of script.
      - id: entry
        say: Open an entry.
        when: { manual: "Click its thumbnail: its moving preview plays with the whole description." }
      - id: take
        say: Keep it, try it, or install it.
        when: { manual: "add to a pad keeps a preset, try now applies it without keeping it, and install puts a script into /moonlive." }
        detail: |
          A preset brings any script it needs that the device lacks. A look or a palette applies at once; one that also sets pins or geometry asks first, since those belong to the author's rig. An entry made on a newer MoonLight says so: update first.
  - id: gallery-share
    title: Share a preset in the gallery, with a moving preview
    actor: user
    goal: An entry in MoonLight-Gallery with a GIF.
    systems: [MoonCore]
    dependsOn: [presets]
    page: how-to/presets.md
    steps:
      - id: copy
        say: Copy the preset's JSON from its card.
        when: { manual: "Press the card's { } button and copy what it shows." }
      - id: gif
        say: Record its moving preview.
        when: { manual: "Apply the preset and press ⏺ on the preview bar: your browser saves three seconds as a GIF, and the device does no extra work." }
      - id: issue
        say: Open an issue in the gallery.
        when: { open: { url: "https://github.com/MoonModules/MoonLight-Gallery#sharing-your-own" } }
        detail: |
          Paste the JSON and attach the GIF. The entry shows in every device's Gallery once it is accepted.
  - id: control-surface
    title: Connect a control surface
    actor: user
    goal: Faders under the hands drive the Control card and follow it back.
    systems: [MoonCore]
    page: how-to/control-surface.md
    inputs:
      type: object
      properties:
        route: { type: string, enum: [Desk or gamepad in the browser, Desk on the board's USB port, Desk on the network, Phone or tablet over OSC, Phone with WLED Native], description: "What do you control from?" }
    intro: |
      Eight switches, eight encoders, eight faders and a pad grid, each driving whatever you assign it. Every route lands on the same surface, so a desk, a phone and the web UI stay in step. Addresses, feedback and troubleshooting: [Connecting a control surface](how-to/control-surface.md).
    steps:
      - id: add-midi
        section: Connect it
        say: Add the Midi service.
        given: [{ input: route, in: [Desk or gamepad in the browser, Desk on the board's USB port, Desk on the network] }]
        when: { add: { module: Services, type: MidiService } }
        detail: |
          A gamepad takes the Gamepad service instead. A Mackie desk in MC mode needs no setup; for an Akai APC40 mkII set `profile` to Akai APC40 mkII. A desk on the network takes it on the board it drives.
      - id: plug-browser
        say: Plug the desk into this computer.
        given: [{ input: route, equals: Desk or gamepad in the browser }]
        when: { manual: "Use Chrome, Edge or Firefox, and allow MIDI devices when it asks." }
        detail: |
          A pad shows once you press any of its buttons. Safari has no Web MIDI. A board's own page is not a secure origin, so Chrome asks nothing: [mark it as secure once](how-to/control-surface.md#a-boards-own-page-needs-marking-as-secure-once). A pad that does not appear: [making a gamepad appear](how-to/control-surface.md#making-a-gamepad-appear).
      - id: source-usb
        say: Set source to USB.
        given: [{ input: route, equals: Desk on the board's USB port }]
        when: { set: { module: MidiService, control: source, value: USB } }
        detail: |
          The board becomes the USB host, and any page works without marking it as secure. It needs an S3 with 8 MB of flash or more.
      - id: plug-usb
        say: Plug the desk into the board.
        given: [{ input: route, equals: Desk on the board's USB port }]
        when: { manual: "The board's port, or a powered hub, supplies the desk's 5 V." }
        detail: |
          An APC40 mkII draws about 0.15 A. The port then carries no serial log and no USB flashing, so a board with a second USB port keeps that one for the computer.
      - id: source-net
        say: Set source to network.
        given: [{ input: route, equals: Desk on the network }]
        when: { set: { module: MidiService, control: source, value: network } }
        detail: |
          The desk is an [RTP-MIDI](https://www.rfc-editor.org/rfc/rfc6295) session, the standard Apple's Network MIDI uses.
      - id: host
        say: Name the desk's end in host.
        given: [{ input: route, equals: Desk on the network }]
        when: { manual: "An address or <name>.local; empty waits to be invited." }
        detail: |
          The host is a board sharing the desk, a desk with a network port, or a computer sharing its desk. The service invites the host every second until it answers, so either side may start first. A Mac's Audio MIDI Setup and Windows' rtpMIDI driver invite a board with an empty `host`.
      - id: share
        say: Share the desk from its board.
        given: [{ input: route, equals: Desk on the network }]
        when: { manual: "On that board set source to USB and turn share on." }
        detail: |
          It then forwards the desk like a network MIDI cable. One host at a time. The host's status says why it was refused: `no desk`, `in use` or `it invites`. [One desk for many boards over OSC](how-to/control-surface.md#one-desk-for-several-boards).
      - id: osc
        say: Follow the OSC process.
        given: [{ input: route, equals: Phone or tablet over OSC }]
        when: { process: osc-control }
      - id: wled-app
        say: Install WLED Native on the phone.
        given: [{ input: route, equals: Phone with WLED Native }]
        when: { open: { url: "https://apps.apple.com/us/app/wled-native/id6446207239" } }
        detail: |
          Free on the App Store for iPhone and iPad, and on [Google Play](https://play.google.com/store/apps/details?id=ca.cgagnier.wlednativeandroid) for Android.
      - id: wled-find
        say: Pick the MoonLight device in the app.
        given: [{ input: route, equals: Phone with WLED Native }]
        when: { manual: "The app finds each device with no setup and no pairing." }
        detail: |
          Each device is a card with a power toggle and a brightness slider.

          ![MoonLight devices discovered in WLED Native](assets/core/WLED%20Native%20discovers%20MoonLight.jpeg){ width="300" }

          WLED Native is by Christophe Gagnier ([@Moustachauve](https://github.com/Moustachauve)); MoonLight speaks the WLED JSON API. Everything else stays at `http://<devicename>.local`.
      - id: assign
        section: Assign the controls
        say: Assign the surface's controls on Control.
        given: [{ in: [Desk or gamepad in the browser, Desk on the board's USB port, Desk on the network], input: route }]
        when: { open: { module: ControlModule } }
        detail: |
          Assign a control such as `fader2` to a game's paddle. Move a fader on the desk and the card follows, and the reverse: motors, lights and knob rings follow the surface back. What each desk does: [What a desk does](how-to/control-surface.md#what-a-desk-does).
    outro: |
      The desk, the phone and the web UI stay in step. When nothing moves, see [when you see nothing](how-to/control-surface.md#when-the-surface-does-nothing).
  - id: osc-control
    title: Control a device from a phone or tablet over OSC
    actor: user
    goal: Eight switches, knobs and faders on a touchscreen move the device and follow it back.
    systems: [MoonCore]
    page: how-to/control-surface.md
    intro: |
      About five minutes, with Open Stage Control and one session file. The addresses and how feedback works: [the OSC addresses](how-to/control-surface.md#the-osc-addresses).
    steps:
      - id: ip
        say: Read the device's IP address.
        when: { open: { module: SystemModule } }
        detail: |
          It is the address you typed into the browser. A desktop install talking to itself uses `127.0.0.1`.
      - id: install
        say: Install Open Stage Control.
        when: { open: { url: "https://openstagecontrol.ammd.net/" } }
        detail: |
          Free and open source, for macOS, Windows and Linux. On macOS the first launch needs a right-click and Open, once, because the download is unsigned.
      - id: session
        say: Download the session file.
        when: { open: { url: "https://github.com/MoonModules/MoonLight/releases/download/latest/MoonLight-control-surface.json" } }
        detail: |
          It is the layout, built from the latest code. It holds no device address, so one file serves every device.
      - id: launcher
        say: Fill in the launcher.
        when: { manual: "Set send to <device-ip>:9000, osc-port to 9001 and load to the session file." }
        detail: |
          `9000` is the device's ear, `9001` the surface's ear, and swapping them is the one place people go wrong. Leave `read-only` off to rearrange the layout later.
      - id: listen
        section: Turn the device's side on
        say: Turn on listen and feedback.
        when: { open: { module: OscService } }
        detail: |
          Without `listen` the device ignores the surface. Set `feedbackPort` to `9001`, matching `osc-port`, and `port` to `9000`. Leave `hosts` empty with `addressing` on `unicast`: it answers whoever last wrote.
      - id: start
        say: Press start.
        when: { manual: "The surface appears. Move a fader and the device reacts; move something in the MoonLight UI and the faders follow." }
        detail: |
          ![The shipped Open Stage Control session beside MoonLight's own Control card](assets/core/OscService-open-stage-control.png)

          `switch1` drives the master on/off and `fader1` the global brightness. From the second slot on, an unassigned slot follows the effect enabled last.
      - id: phone
        section: Use it from a phone
        say: Browse to the computer's port 8080.
        when: { manual: "On any phone or tablet on the same network open http://<computer-running-open-stage-control>:8080." }
        detail: |
          Open Stage Control serves the surface as a web page, and its console names the port. If MoonLight's own UI is on 8080 on that machine, give Open Stage Control another port in its launcher.
      - id: repo
        say: Run it from a checkout in one command.
        when: { run: { script: moondeck/run/run_open_stage_control.py, args: "--host <device-ip>" } }
        detail: |
          It replaces the install, session and launcher steps: it finds the app, passes the session, the address and both ports, and runs headless at http://127.0.0.1:8088. Options: `--host` and `--port` (the device and its OSC `port`, default `127.0.0.1:9000`), `--listen` (the device's `feedbackPort`, default 9001), `--ui-port` (default 8088).
    outro: |
      You still turn `listen` and `feedback` on at the device. When nothing moves: [when you see nothing](how-to/control-surface.md#when-the-surface-does-nothing).
  - id: hold-to-play
    title: Play an effect while a button is held
    actor: user
    goal: A held button shows its effect over a standby effect, and releasing it brings the standby back.
    systems: [MoonCore, MoonLight]
    dependsOn: [first-light-show]
    page: how-to/hold-to-play.md
    intro: |
      Layers stack: a Standby layer always shows, and each trick layer sits above it at opacity 0. A Control fader drives each trick's opacity, and a Button on a GPIO writes 255 to the fader while held. A foot pedal or a wired button works, an infrared remote does not (it sends no release).
    steps:
      - id: layers
        section: Build the layers
        say: Open Effects.
        when: { open: { module: Effects } }
        detail: |
          Add a Layer named Standby with an effect, then one Layer per trick, named Trick1, Trick2 and so on, each with its effect. Up to eight tricks fit, one per Control fader.
      - id: opacity
        say: Set each trick's opacity to 0.
        when: { manual: "Trick layers show nothing until a fader raises their opacity." }
      - id: faders
        say: Open Control.
        when: { open: { module: ControlModule } }
      - id: target
        say: Point each fader at its trick.
        when: { manual: "Set fader1Target to Trick1.opacity, fader2Target to Trick2.opacity, and so on." }
      - id: buttons
        section: Wire the buttons
        say: Open Services.
        when: { open: { module: Services } }
      - id: add-button
        say: Add the Button service.
        when: { add: { module: Services, type: ButtonService } }
      - id: row
        say: Add one row per button.
        when: { manual: "Set pin to the GPIO, target to Control.fader1 (then fader2), kind to set, value to 255, and activeLow on for a button wired to ground." }
        detail: |
          The card's `pressed` readout shows each press before anything is bound. A `value` below 255 blends the trick over Standby instead of covering it.
      - id: try
        section: Try it
        say: Hold a button.
        when: { manual: "Its trick covers Standby while held; releasing returns Standby." }
    outro: |
      Wireless works too when the receiver has momentary outputs wired to GPIOs, such as a 4 or 8 channel 433 MHz module. For logic of your own, such as another standby after a trick, a [MoonLive service](moonmodules/core/services.md#moonliveservice) script drives the same controls.
  - id: smart-home
    title: Bring the device into a smart home
    actor: user
    goal: On/off, brightness and color from Home Assistant, Apple Home or Homebridge.
    systems: [MoonCore]
    page: how-to/home-automation.md
    inputs:
      type: object
      properties:
        platform: { type: string, enum: [Home Assistant, Homebridge, Hue lights], description: "Which platform?" }
    intro: |
      Home Assistant and Homebridge drive the device from their app, voice assistant and automations. Hue lights run the other way: the device drives your Hue bulbs as the pixels of an effect. The hub and broker run already; installing them, the MQTT topics and the troubleshooting: [Home automation](how-to/home-automation.md).
    steps:
      - id: ha-find
        section: Adopt in Home Assistant
        say: Look for the device in Home Assistant.
        given: [{ input: platform, equals: Home Assistant }]
        when: { manual: "Home Assistant finds it on its own over the WLED path." }
        detail: |
          It lists the device as a light with color, palette and brightness, with 💫 in its name marking it as MoonLight. This path needs no broker.
      - id: broker
        section: Connect the broker
        say: Set the broker on the MQTT card.
        given: [{ input: platform, in: [Home Assistant, Homebridge] }]
        when: { open: { module: MqttModule } }
        detail: |
          Set `broker` to the broker's hostname or LAN IP, never `127.0.0.1`, which is loopback on the broker's own host. For Home Assistant's broker it is the IP its console prints. Set `port`, usually `1883`, and `username` and `password` when the broker requires them, for Home Assistant the user created for MQTT. Home Assistant needs this only for a broker-only or cross-subnet setup.
      - id: ha-discovery
        say: Turn haDiscovery on.
        given: [{ input: platform, equals: Home Assistant }]
        when: { set: { module: MqttModule, control: haDiscovery, value: true } }
        detail: |
          Home Assistant then creates a light entity with on/off and brightness, grayed out when the device is offline. Leave it off on the WLED path: both together list the device twice. Never hand-configure Home Assistant's generic MQTT light against `homeassistant/light/...`.
      - id: ha-verify
        say: Check the device's topics reach Home Assistant.
        given: [{ input: platform, equals: Home Assistant }]
        when: { manual: "MQTT integration, Configure, Listen to topic: MoonLight/#." }
        detail: |
          The device's on, brightness and hsv topics appear.
      - id: hb-verify
        say: Check the device's topics reach the broker.
        given: [{ input: platform, equals: Homebridge }]
        when: { run: { command: "mosquitto_sub -t 'MoonLight/#' -v" } }
        detail: |
          The device's on, brightness and hsv topics and its retained name appear. Its MAC suffix, the last 6 hex digits, is in the topics: you need it in the accessory.
      - id: ha-homekit
        section: Reach Apple Home
        say: Add the HomeKit Bridge integration.
        given: [{ input: platform, equals: Home Assistant }]
        when: { manual: "Settings, Devices & Services, Add Integration, HomeKit Bridge." }
        detail: |
          Optional, to reach Apple Home. Pick **Include selected entities** and tick the MoonLight light.
      - id: ha-pair
        say: Scan the code in the Home app.
        given: [{ input: platform, equals: Home Assistant }]
        when: { manual: "Add Accessory, More options, HA HomeKit Bridge." }
        detail: |
          Home Assistant prints the QR code and a PIN; scan the code or enter the PIN.
      - id: hb-plugin
        say: Install the homebridge-mqttthing plugin.
        given: [{ input: platform, equals: Homebridge }]
        when: { manual: "From the Config UI Plugins screen, or with `npm i -g homebridge-mqttthing`." }
      - id: hb-accessory
        say: Add the lightbulb accessory to Homebridge.
        given: [{ input: platform, equals: Homebridge }]
        when: { read: { page: how-to/home-automation.md, section: The Homebridge accessory } }
        detail: |
          Add it in the Config UI Config editor or in `~/.homebridge/config.json`. Set `url` to `mqtt://<broker>:1883`, or `mqtt://127.0.0.1:1883` when Homebridge and the broker share a host. Replace `563cfe` in every topic with your MAC suffix, and match `username` and `password` to the broker or remove them.
      - id: hb-restart
        say: Restart Homebridge.
        given: [{ input: platform, equals: Homebridge }]
        when: { manual: "The accessory is listed in the Config UI." }
      - id: hb-pair
        say: Pair the bridge in the Home app.
        given: [{ input: platform, equals: Homebridge }]
        when: { manual: "Add Accessory, More options, the Homebridge bridge." }
        detail: |
          Use the PIN Homebridge prints on start. The device appears as a light with on/off, brightness and a color wheel that steps through palettes.
      - id: hue-driver
        section: Drive Hue lights
        say: Add a Hue driver to Drivers.
        given: [{ input: platform, equals: Hue lights }]
        when: { add: { module: Drivers, type: HueDriver } }
        detail: |
          Enter the bridge's IP in `bridgeIp`. Find it in the Hue app or at [discovery.meethue.com](https://discovery.meethue.com). Hue is a rate-limited hub of about 10 commands a second, so the result is smooth ambient color, not strobing. Behavior and controls: [Drivers, Hue](moonmodules/light/drivers.md#hue).
      - id: hue-link
        say: Press the link button on the bridge.
        given: [{ input: platform, equals: Hue lights }]
        when: { manual: "It opens a 30-second pairing window." }
      - id: hue-pair
        say: Press pair within 30 seconds.
        given: [{ input: platform, equals: Hue lights }]
        when: { open: { module: HueDriver } }
        detail: |
          The device claims an app key, stored on the driver as `appKey`, once. The status line reads `paired, N lights`.
      - id: hue-pick
        say: Pick the room and light to drive.
        given: [{ input: platform, equals: Hue lights }]
        when: { manual: "Use the driver's room and light controls." }
        detail: |
          All bulbs, one room or a single light. Only reachable Extended color lights are driven: white-only bulbs, plugs and powered-off lights are skipped.
      - id: hue-layout
        say: Size the layout as one column of bulbs.
        given: [{ input: platform, equals: Hue lights }]
        when: { open: { module: Layouts } }
        detail: |
          Use width 1 and height equal to the number of Hue lights. Each pixel of the column maps to one bulb in order, so a 1D effect such as a rainbow or a chase reads across the bulbs.
      - id: hue-effect
        say: Run an effect.
        given: [{ input: platform, equals: Hue lights }]
        when: { manual: "Any effect on the layer drives the bulbs." }
        detail: |
          Global brightness and color order apply as on a strip; brightness 0 turns a bulb off.
    outro: |
      The topics the platforms use, presets in Home Assistant and troubleshooting: [Home automation](how-to/home-automation.md).
