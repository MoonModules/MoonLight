# yaml-language-server: $schema=moonwalk.schema.json
stage: Everyday use
summary: Looks, the gallery and hands-on control.
processes:
  - id: presets
    title: Save, edit and apply a preset
    actor: user
    goal: A look, geometry, hardware or service setup recalled with one click.
    systems: [MoonCore]
    dependsOn: [first-light-show]
    page: reference/presets.md
    intro: |
      A preset is a saved state brought back with one click: a look, a geometry or a hardware setup. They live on the Control card as a grid of 64 pads. What a preset holds and how applying one behaves: [Presets](reference/presets.md).
    steps:
      - id: open
        section: Save one
        say: Open Control.
        when: { open: { module: ControlModule } }
      - id: editor
        say: Open an empty pad's editor.
        when: { manual: "Click an empty pad, or right-click a full one; on a touchscreen, press and hold it." }
      - id: save
        say: Save the current state on the pad.
        when: { manual: "Give it a name, pick its container and press save current state here." }
        detail: |
          Effects is a look, Layouts a geometry, Drivers a hardware setup, Services a service configuration. One container per save keeps a look portable: an Effects preset applies on any board, since it carries no pins.

          Any card saves itself too: its `{ }` button, a name and **save as preset** put that card alone on the first free pad.
      - id: apply
        section: Apply it
        say: Click the pad.
        when: { manual: "What it holds replaces what was there. One preset per container stays lit, so a layout and a look apply together." }
      - id: change
        section: Change it
        say: Open its editor.
        when: { manual: "Right-click the pad, or press and hold it." }
        detail: |
          - **What it holds:** apply it, change the cards, then press **save current state over it**.
          - **Its name:** edit **name**; it applies on Enter.
          - **Delete it:** press **delete preset**.
          - **Move it:** drag it onto another pad, which swaps the two.
      - id: list-api
        section: Over the API
        say: List the presets a device has.
        when: { call: { operation: listDir, params: { path: /.config/presets } } }
        detail: |
          A preset is a file, `/.config/presets/<name>.json`, holding the tree and its values together. The list is rebuilt from the folder, so a file written there straight appears at the next rescan: a reboot, or any save, rename or delete on the card.
      - id: apply-api
        say: Apply one by name.
        when: { call: { operation: applyListRow, params: { module: Control, control: presets, row: "<name>" } } }
        detail: |
          As a click on its pad does: `<name>` is the pad's name.
  - id: gallery-install
    title: Install a preset or script from the gallery
    actor: user
    goal: Something shared lands on a pad or in /moonlive.
    systems: [MoonCore, MoonLive]
    page: reference/presets.md
    intro: |
      The Gallery under the pads shows what people shared in [MoonLight-Gallery](https://github.com/MoonModules/MoonLight-Gallery). Your browser fetches it, so the device needs no internet of its own.
    steps:
      - id: open
        say: Open the Gallery under the pads.
        when: { open: { module: ControlModule } }
        detail: |
          Entries show most liked or newest first. Search covers the name, the description and the author, and a chip per kind narrows it to presets or one kind of script.
      - id: entry
        say: Open an entry.
        when: { manual: "Click its thumbnail: its moving preview plays with the whole description." }
      - id: take
        say: Keep it, try it, or install it.
        when: { manual: "add to a pad keeps a preset, try now applies it without keeping it, and install puts a script into /moonlive." }
        detail: |
          A preset brings any script it needs that the device lacks. A look or a palette applies at once; one that also sets pins or geometry asks first, since those belong to the author's rig. An entry made on a newer MoonLight says so: update first.
  - id: gallery-share
    title: Share a preset in the gallery, with a moving preview
    actor: user
    goal: An entry in MoonLight-Gallery with a GIF.
    systems: [MoonCore]
    dependsOn: [presets]
    page: reference/presets.md
    steps:
      - id: copy
        say: Copy the preset's JSON from its card.
        when: { manual: "Press the card's { } button and copy what it shows." }
      - id: gif
        say: Record its moving preview.
        when: { manual: "Apply the preset and press ⏺ on the preview bar: your browser saves three seconds as a GIF, and the device does no extra work." }
      - id: issue
        say: Open an issue in the gallery.
        when: { open: { url: "https://github.com/MoonModules/MoonLight-Gallery#sharing-your-own" } }
        detail: |
          Paste the JSON and attach the GIF. The entry shows in every device's Gallery once it is accepted.
  - id: control-surface
    title: Connect a control surface
    actor: user
    goal: Faders under the hands drive the Control card and follow it back.
    systems: [MoonCore]
    page: reference/control-surface.md
    inputs:
      type: object
      properties:
        route: { type: string, enum: [Desk in the browser, Gamepad in the browser, Desk on the board's USB port, Desk on the network, Phone or tablet over OSC, Phone with WLED Native], description: "What do you control from?" }
    intro: |
      Eight switches, eight encoders, eight faders and a pad grid, each driving whatever you assign it. Every route lands on the same surface, so a desk, a phone and the web UI stay in step. Addresses, feedback and troubleshooting: [Connecting a control surface](reference/control-surface.md).
    steps:
      - id: add-midi
        section: Connect it
        say: Add the Midi service.
        given: [{ input: route, in: [Desk in the browser, Desk on the board's USB port, Desk on the network] }]
        when: { add: { module: Services, type: MidiService } }
        detail: |
          A Mackie desk in MC mode needs no setup; for an Akai APC40 mkII set `profile` to Akai APC40 mkII. A desk on the network takes it on the board it drives.
      - id: add-gamepad
        say: Add the Gamepad service.
        given: [{ input: route, equals: Gamepad in the browser }]
        when: { add: { module: Services, type: GamepadService } }
        detail: |
          It comes with default rows for the sticks and the A button.
      - id: plug-browser
        say: Plug the desk into this computer.
        given: [{ input: route, in: [Desk in the browser, Gamepad in the browser] }]
        when: { manual: "Use Chrome, Edge or Firefox, and allow MIDI devices when it asks." }
        detail: |
          A pad shows once you press any of its buttons. Safari has no Web MIDI. A board's own page is not a secure origin, so Chrome asks nothing until you mark it as secure once ([why](reference/control-surface.md#a-boards-own-page-needs-marking-as-secure-once)):

          1. Open `chrome://flags/#unsafely-treat-insecure-origin-as-secure`.
          2. Enter the board's address, such as `http://192.168.1.158`, set the flag to Enabled, and click Relaunch.
          3. Reload the board's page: Chrome now asks to use MIDI devices.

          A pad that does not appear: [making a gamepad appear](reference/control-surface.md#making-a-gamepad-appear).
      - id: source-usb
        say: Set source to USB.
        given: [{ input: route, equals: Desk on the board's USB port }]
        when: { set: { module: MidiService, control: source, value: USB } }
        detail: |
          The board becomes the USB host, and any page works without marking it as secure. It needs an S3 with 8 MB of flash or more.
      - id: plug-usb
        say: Plug the desk into the board.
        given: [{ input: route, equals: Desk on the board's USB port }]
        when: { manual: "The board's port, or a powered hub, supplies the desk's 5 V." }
        detail: |
          An APC40 mkII draws about 0.15 A. The port then carries no serial log and no USB flashing, so a board with a second USB port keeps that one for the computer.
      - id: source-net
        say: Set source to network.
        given: [{ input: route, equals: Desk on the network }]
        when: { set: { module: MidiService, control: source, value: network } }
        detail: |
          The desk is an [RTP-MIDI](https://www.rfc-editor.org/rfc/rfc6295) session, the standard Apple's Network MIDI uses.
      - id: host
        say: Name the desk's end in host.
        given: [{ input: route, equals: Desk on the network }]
        when: { manual: "An address or <name>.local; empty waits to be invited." }
        detail: |
          The host is a board sharing the desk, a desk with a network port, or a computer sharing its desk. The service invites the host every second until it answers, so either side may start first. A Mac's Audio MIDI Setup and Windows' rtpMIDI driver invite a board with an empty `host`.
      - id: share-source
        say: Take the desk from the USB port.
        given: [{ input: route, equals: Desk on the network }]
        when: { set: { module: MidiService, control: source, value: USB } }
      - id: share
        say: Share the desk from its board.
        given: [{ input: route, equals: Desk on the network }]
        when: { set: { module: MidiService, control: share, value: true } }
        detail: |
          It then forwards the desk like a network MIDI cable. One host at a time. The host's status says why it was refused: `no desk`, `in use` or `it invites`. [One desk for many boards over OSC](reference/control-surface.md#one-desk-for-several-boards).
      - id: osc
        say: Follow the OSC process.
        given: [{ input: route, equals: Phone or tablet over OSC }]
        when: { process: osc-control }
      - id: wled-app
        say: Install WLED Native on the phone.
        given: [{ input: route, equals: Phone with WLED Native }]
        when: { open: { url: "https://apps.apple.com/us/app/wled-native/id6446207239" } }
        detail: |
          Free on the App Store for iPhone and iPad, and on [Google Play](https://play.google.com/store/apps/details?id=ca.cgagnier.wlednativeandroid) for Android.
      - id: wled-find
        say: Pick the MoonLight device in the app.
        given: [{ input: route, equals: Phone with WLED Native }]
        when: { manual: "The app finds each device with no setup and no pairing." }
        detail: |
          Each device is a card with a power toggle and a brightness slider.

          ![MoonLight devices discovered in WLED Native](assets/core/WLED%20Native%20discovers%20MoonLight.jpeg){ width="300" }

          WLED Native is by Christophe Gagnier ([@Moustachauve](https://github.com/Moustachauve)); MoonLight speaks the WLED JSON API. Everything else stays at `http://<devicename>.local`.
      - id: assign
        section: Assign the controls
        say: Assign the surface's controls on Control.
        given: [{ in: [Desk in the browser, Gamepad in the browser, Desk on the board's USB port, Desk on the network], input: route }]
        when: { open: { module: ControlModule } }
        detail: |
          Assign a control such as `fader2` to a game's paddle. Move a fader on the desk and the card follows, and the reverse: motors, lights and knob rings follow the surface back. What each desk does: [What a desk does](reference/control-surface.md#what-a-desk-does).
    outro: |
      The desk, the phone and the web UI stay in step. When nothing moves, see [when you see nothing](reference/control-surface.md#when-the-surface-does-nothing).
  - id: osc-control
    title: Control a device from a phone or tablet over OSC
    actor: user
    goal: Eight switches, knobs and faders on a touchscreen move the device and follow it back.
    systems: [MoonCore]
    page: reference/control-surface.md
    intro: |
      About five minutes, with Open Stage Control and one session file. The addresses and how feedback works: [the OSC addresses](reference/control-surface.md#the-osc-addresses).
    steps:
      - id: ip
        say: Read the device's address on WiFi.
        when: { open: { module: WiFiModule } }
        detail: |
          Its `address` is what you typed into the browser. A desktop install talking to itself uses `127.0.0.1`.
      - id: install
        say: Install Open Stage Control.
        when: { open: { url: "https://openstagecontrol.ammd.net/" } }
        detail: |
          Free and open source, for macOS, Windows and Linux. On macOS the first launch needs a right-click and Open, once, because the download is unsigned.

          From a source checkout, one command replaces this step, the session and the launcher: `uv run moondeck/run/run_open_stage_control.py --host <device-ip>` ([One command, from a checkout](reference/control-surface.md#one-command-from-a-checkout)).
      - id: session
        say: Download the session file.
        when: { open: { url: "https://github.com/MoonModules/MoonLight/releases/download/latest/MoonLight-control-surface.json" } }
        detail: |
          It is the layout, built from the latest code. It holds no device address, so one file serves every device.
      - id: launcher
        say: Fill in the launcher.
        when: { manual: "Set send to <device-ip>:9000, osc-port to 9001 and load to the session file." }
        detail: |
          `9000` is the device's ear, `9001` the surface's ear, and swapping them is the one place people go wrong. Leave `read-only` off to rearrange the layout later.
      - id: listen
        section: Turn the device's side on
        say: Turn on listen and feedback.
        when: { open: { module: OscService } }
        detail: |
          Without `listen` the device ignores the surface. Set `feedbackPort` to `9001`, matching `osc-port`, and `port` to `9000`. Leave `hosts` empty with `addressing` on `unicast`: it answers whoever last wrote.
      - id: start
        say: Press start.
        when: { manual: "The surface appears. Move a fader and the device reacts; move something in the MoonLight UI and the faders follow." }
        detail: |
          ![The shipped Open Stage Control session beside MoonLight's own Control card](assets/core/OscService-open-stage-control.png)

          `switch1` drives the master on/off and `fader1` the global brightness. From the second slot on, an unassigned slot follows the effect enabled last.
      - id: phone
        section: Use it from a phone
        say: Browse to the computer's port 8080.
        when: { manual: "On any phone or tablet on the same network open http://<computer-running-open-stage-control>:8080." }
        detail: |
          Open Stage Control serves the surface as a web page, and its console names the port. If MoonLight's own UI is on 8080 on that machine, give Open Stage Control another port in its launcher.
    outro: |
      You still turn `listen` and `feedback` on at the device. When nothing moves: [when you see nothing](reference/control-surface.md#when-the-surface-does-nothing).
  - id: hold-to-play
    title: Play an effect while a button is held
    actor: user
    goal: A held button shows its effect over a standby effect, and releasing it brings the standby back.
    systems: [MoonCore, MoonLight]
    dependsOn: [first-light-show]
    page: reference/examples/hold-to-play.md
    intro: |
      Layers stack: a Standby layer always shows, and each trick layer sits above it at opacity 0. A Control fader drives each trick's opacity, and a Button on a GPIO writes 255 to the fader while held. A foot pedal or a wired button works, an infrared remote does not (it sends no release).
    steps:
      - id: layers
        section: Build the layers
        say: Open Effects.
        when: { open: { module: Effects } }
        detail: |
          Add a Layer named Standby with an effect, then one Layer per trick, named Trick1, Trick2 and so on, each with its effect. Up to eight tricks fit, one per Control fader.
      - id: opacity
        say: Set each trick's opacity to 0.
        when: { set: { module: Layer, control: opacity, value: 0 } }
        detail: |
          Trick layers show nothing until a fader raises their opacity.
      - id: faders
        say: Open Control.
        when: { open: { module: ControlModule } }
      - id: target
        say: Point each fader at its trick.
        when: { manual: "Set fader1Target to Trick1.opacity, fader2Target to Trick2.opacity, and so on." }
      - id: buttons
        section: Wire the buttons
        say: Open Services.
        when: { open: { module: Services } }
      - id: add-button
        say: Add the Button service.
        when: { add: { module: Services, type: ButtonService } }
      - id: row
        say: Add one row per button.
        when: { manual: "Set pin to the GPIO, target to Control.fader1 (then fader2), kind to set, value to 255, and activeLow on for a button wired to ground." }
        detail: |
          The card's `pressed` readout shows each press before anything is bound. A `value` below 255 blends the trick over Standby instead of covering it.
      - id: try
        section: Try it
        say: Hold a button.
        when: { manual: "Its trick covers Standby while held; releasing returns Standby." }
    outro: |
      Wireless works too when the receiver has momentary outputs wired to GPIOs, such as a 4 or 8 channel 433 MHz module. For logic of your own, such as another standby after a trick, a [MoonLive service](moonmodules/core/services.md#moonliveservice) script drives the same controls.
