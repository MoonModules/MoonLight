# yaml-language-server: $schema=moonwalk.schema.json
stage: Plan and set up
summary: A picked topic on its own branch, on a computer set up to build it.
processes:
  - id: pick-spec-plan
    title: Pick, spec and plan a topic
    actor: product-owner
    goal: A module, effect, driver or capability has an approved plan before code.
    systems: [MoonWalk]
    page: contributing/principles-and-process.md
    inputs:
      type: object
      properties:
        kind: { type: string, enum: [Feature, Restructure], description: "Does the topic add to the system, or reshape it?" }
    intro: |
      A topic is one module, effect, driver or capability, picked from [the Project](https://github.com/users/MoonModules/projects/5): a card the product owner accepts moves from Backlog to Next and becomes an issue through the card's own Convert to issue, which an agent may pick up (a doc links an issue, the item's own or the tracking issue listing its card, since GitHub keeps an issue's address and not a card's), and moves to In progress when work starts. The plan is the contract for the branch. It absorbs the cards on its topic, which are deleted, so one topic has one home while it is being built and the Project keeps only what no plan covers. A topic the product owner picks directly starts as a plan the same way, with no card before it: a card is the backlog, a plan is the work.
    steps:
      - id: pick
        say: Name one module, effect, driver or capability.
        when: { manual: "One topic per cycle." }
      - id: spec
        say: Shape the spec before any code.
        actor: agent
        when: { manual: "The architect shapes it and the researcher maps the prior art." }
        detail: |
          The spec holds enough to build from, checked against the README, CLAUDE.md and the [architecture](explanation/architecture/index.md). It lives on the topic's card, when it has one, until a plan absorbs it, and a long investigation is a [design study](design/index.md) the card cites. When in doubt on a spec, ask.
      - id: end-states
        say: Name two to four end states.
        actor: agent
        given: [{ input: kind, equals: Restructure }]
        when: { manual: "For each, write what it gains and what it loses." }
        detail: |
          The plan builds the one end state the product owner picks.
      - id: plan
        say: Write the plan.
        actor: agent
        when: { manual: "Save it as docs/work/Plan-YYYYMMDD - title.md." }
        detail: |
          Written in plan mode, and edited as reality changes once approved. Each step carries its status: ✅ built and verified, 🧪 built and awaiting the test named beside it, 🚧 partly built with what is missing named beside it, ⏳ not started. The file name counts them, `(3 of 7)` for three steps ✅ of seven, when the product owner asks, since a renamed file is a new file to git. Everything else on the topic sits in the plan's `Backlog` section. A step that tunes against a measurement names its stop rule before the first run: the ceiling the field reports, the target, and the gain a change must buy to keep going.
      - id: approve
        say: Approve the plan.
        when: { manual: "Read it first: code starts after the approval." }
        detail: |
          Each cycle subtracts as well as adds.
      - id: step-home
        say: Move a finished step's content home, link it.
        actor: agent
        when: { manual: "When a step of a plan is ✅, and again for a plan that is finished." }
        detail: |
          What the system now is, how it works, why, and the measured facts worth keeping move to the page that owns them: a reason to the explanation, a fact to a reference page, a lesson to the lessons. What the page already says stays where it is. The step keeps its title, its status, one line of what is done and a link with an anchor to where it lives; who tested what when stays in git. A finished plan is then only references, and [deleting it](moonwalk.md#pick-spec-plan) is a small step.
      - id: delete
        say: Delete the finished plan.
        actor: product-owner
        when: { manual: "Once every step is built and verified, the judgment steps included, or once it is stopped, and the product owner says the docs hold everything: their call, never the agent's." }
        detail: |
          A finished plan may stay in `docs/work/` a while. Before it goes, what only the plan holds goes home: a reason, a decision with its rejected alternatives, to the explanation; a fact to a reference page; a lesson to the lessons; analysis an open plan uses to a [design study](design/index.md). Its remaining backlog returns to the Project as cards, decided item by item. Then the file is deleted, with plain `rm`, and git keeps its history: `git log --diff-filter=D -- docs/work/` lists every deleted plan.
  - id: branch
    title: Branch and work on it
    actor: product-owner
    goal: Feature work lands on a branch the product owner created, and main stays releasable.
    dependsOn: [pick-spec-plan]
    intro: |
      Main is always releasable: what is on main ships as the latest pre-release, and tagged releases are cut from it. Feature work branches; a branch may bundle several topics, one combined commit per cycle.
    steps:
      - id: create
        say: Create the branch for the topic.
        when: { run: { command: "git switch -c <branch-name>" } }
        detail: |
          The product owner creates every branch, and whoever initiates a branch submits its pull request. The agent works on the branch it is given and asks when a change does not belong there. The one exception: a small fix, already verified, goes straight to main.
      - id: session
        say: Start a fresh agent session for the branch.
        when: { manual: "A new Claude session, not the one the last branch used." }
        detail: |
          The previous topic's context steers the next one, and a long context costs every turn. A large commit is a point to start fresh too: the next commit then begins from the repository rather than from the conversation.
      - id: work
        say: Prove the change on the host.
        actor: contributor
        when: { process: host-build-test }
        detail: |
          Keep each commit under about 100 changed files: CodeRabbit reviews the files a pushed commit changes, and past that the commit silently loses a review layer. A mechanical sweep, such as em-dashes or a metrics refresh, is a commit of its own, apart from behavioral fixes, so both stay reviewable.
  - id: build-setup
    title: Set up a computer to build MoonLight
    actor: contributor
    goal: uv, CMake 3.20 or newer, a C++20 compiler and ccache on the machine, once.
    systems: [MoonDeck]
    inputs:
      type: object
      properties:
        platform: { type: string, enum: [macOS, Linux, Windows], description: "Which computer?" }
    steps:
      - id: mac
        say: Install Xcode's command line tools, CMake, uv, ccache.
        given: [{ input: platform, equals: macOS }]
        when: { run: { command: "xcode-select --install; brew install cmake uv ccache && ccache --max-size 20G" } }
        detail: |
          ccache's 5 GB default holds about one target; 20 GB holds the host, the tests and every ESP32 target, which share one cache.
      - id: linux
        say: Install CMake, a compiler, ccache and uv.
        given: [{ input: platform, equals: Linux }]
        when: { run: { command: "sudo apt install cmake g++ ccache && curl -LsSf https://astral.sh/uv/install.sh | sh" } }
        detail: |
          GCC 12 or Clang 15 from your distribution, and uv from astral's installer.
      - id: linux-cache
        say: Size ccache for every target.
        given: [{ input: platform, equals: Linux }]
        when: { run: { command: "ccache --max-size 20G" } }
        detail: |
          Its own step, so a failed install reports its own status; the same size as on macOS.
      - id: windows
        say: Install CMake and the Visual Studio Build Tools.
        given: [{ input: platform, equals: Windows }]
        when: { run: { command: "winget install Kitware.CMake; winget install astral-sh.uv; winget install Microsoft.VisualStudio.2022.BuildTools --override \"--passive --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset --includeRecommended\"" } }
        detail: |
          Visual Studio 2022 with the MSVC v143 workload, the clang-cl compiler MoonLight builds with, and the Windows 11 SDK, from an elevated terminal.

          `build_host.py` runs from any PowerShell; calling `clang-cl.exe` by hand takes a **Developer PowerShell for VS 2022**.
      - id: moondeck
        say: Start MoonDeck.
        when: { run: { command: "uv run moondeck/moondeck.py" } }
        detail: |
          Open `http://localhost:8420` in the browser. Every MoonDeck script a process runs is one of its cards, and the same scripts run from a terminal.
  - id: windows-over-ssh
    title: Reach a Windows build machine over SSH
    actor: contributor
    goal: A Windows bench you build and test on by SSH key.
    systems: [MoonDeck]
    dependsOn: [build-setup]
    page: reference/build-system.md
    intro: |
      The commands and their reasons: [A Windows machine over SSH](reference/build-system.md#a-windows-machine-over-ssh).
    steps:
      - id: server
        section: On Windows
        say: Install and start the OpenSSH server.
        when: { run: { command: "Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0; Set-Service sshd -StartupType Automatic; Start-Service sshd" } }
      - id: shell
        say: Make PowerShell its shell.
        when: { manual: "The DefaultShell registry value." }
      - id: key
        say: Add your public key for your account.
        when: { manual: "An administrator's goes in administrators_authorized_keys." }
      - id: firewall
        say: Open port 22 on its network.
        when: { manual: "Public networks too." }
      - id: key-only
        section: From your machine
        say: Turn password login off.
        when: { manual: "PasswordAuthentication and KbdInteractiveAuthentication off." }
      - id: build
        say: Build and test over SSH.
        when: { process: host-build-test }
      - id: desktop
        say: Start MoonLight on the desktop.
        when: { manual: "An interactive scheduled task." }
  - id: setup-editor
    title: Set up the editor
    actor: contributor
    goal: Diagnostics appear as you type, from the same `.clang-tidy` CI uses.
    systems: [MoonDeck]
    dependsOn: [build-setup]
    steps:
      - id: clangd
        say: Install the clangd extension.
        when: { run: { command: "code --install-extension llvm-vs-code-extensions.vscode-clangd" } }
        detail: |
          Nothing else to configure: `.clangd` points at the compilation database, and any build refreshes it, since `CMakeLists.txt` sets `CMAKE_EXPORT_COMPILE_COMMANDS`. clangd skips the checks it counts as slow, so CI stays the authority.
      - id: intellisense
        say: Turn off IntelliSense.
        when: { manual: "With clangd, it reports every diagnostic twice, and they disagree." }
      - id: build-once
        say: Build the host once.
        when: { run: { script: moondeck/build/build_host.py } }
        detail: |
          It writes the compilation database clangd reads.

          **Every file reports `'cstdint' file not found`?** The build directory was configured with another compiler than clangd uses. `.clangd`'s `--query-driver` covers the usual ones; add a new toolchain there.
  - id: bump-idf
    title: Bump the ESP-IDF pin
    actor: contributor
    goal: Every ESP32 target builds on the new IDF, locally and in CI.
    systems: [MoonDeck]
    dependsOn: [esp32-build-flash]
    intro: |
      A pin move is a deliberate re-test pass, never a routine pull. What the pin is and why: [ESP-IDF version](reference/build-system.md#esp-idf-version).
    steps:
      - id: pins
        say: Move the pin in its three places.
        when: { manual: "build_esp32.py's PINNED_IDF_COMMIT and PINNED_IDF_VERSION; release.yml's esp_idf_version and its cache key; build-system.md's ESP-IDF version." }
        detail: |
          In `moondeck/build/build_esp32.py`; in `.github/workflows/release.yml` the Docker tag `esp_idf_version` and the `esp-idf-v<version>` cache key; and the tag and commit [the build system](reference/build-system.md#esp-idf-version) names.
      - id: fetch
        say: Fetch the new tag into the IDF checkout.
        when: { run: { command: "git -C ~/esp/esp-idf fetch origin tag <PINNED_IDF_VERSION>" } }
      - id: checkout
        say: Move the IDF checkout onto the new pin.
        when: { run: { script: moondeck/build/setup_esp_idf.py } }
        detail: |
          Setup checks out the pinned commit and its submodules, recursively: a different IDF commit without its submodules builds against the old ones.
      - id: build-all
        say: Build every ESP32 firmware, one at a time.
        when: { manual: "build_esp32.py --firmware <name>, once per variant." }
        detail: |
          One at a time: the variants share their managed components.
      - id: retest
        say: Re-test each chip family on a board.
        when: { process: live-verification }
        detail: |
          A classic, an S3, an S31 and a P4, with the device scenarios.
      - id: commit
        say: Commit the pin move.
        when: { process: commit }
