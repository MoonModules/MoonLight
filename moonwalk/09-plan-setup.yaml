# yaml-language-server: $schema=moonwalk.schema.json
stage: Plan and set up
summary: A picked topic on its own branch, on a computer set up to build it.
processes:
  - id: pick-spec-plan
    title: Pick, spec and plan a topic
    actor: product-owner
    goal: A module, effect, driver or capability has an approved plan before code.
    systems: [MoonWalk]
    page: contributing/principles-and-process.md
    inputs:
      type: object
      properties:
        kind: { type: string, enum: [Feature, Restructure], description: "Does the topic add to the system, or reshape it?" }
    intro: |
      A topic is one module, effect, driver or capability. The plan is the contract for the branch. A draft may wait in `docs/work/future/` until its topic is picked.

      The pull request description links the plan, and the plan moves to `docs/work/past/plans/` in that same pull request, the product owner's call, with its status in its name: `(shipped)` once every step is built and verified, the judgment steps included, since the code being written is not the plan being realized; otherwise `(cancelled)`, `(superseded)` or `(attempted, reverted)`.
    steps:
      - id: pick
        say: Name one module, effect, driver or capability.
        when: { manual: "One topic per cycle." }
      - id: spec
        say: Shape the spec before any code.
        actor: agent
        when: { manual: "The architect shapes it and the researcher maps the prior art." }
        detail: |
          The spec holds enough to build from, checked against the README, CLAUDE.md and the [architecture](explanation/architecture/index.md). When in doubt on a spec, ask.
      - id: end-states
        say: Name two to four end states.
        actor: agent
        given: [{ input: kind, equals: Restructure }]
        when: { manual: "For each, write what it gains and what it loses." }
        detail: |
          The plan builds the one end state the product owner picks.
      - id: plan
        say: Write the plan.
        actor: agent
        when: { manual: "Save it as docs/work/present/Plan-YYYYMMDD - title.md." }
      - id: approve
        say: Approve the plan.
        when: { manual: "Read it first: code starts after the approval." }
        detail: |
          Each cycle subtracts as well as adds.
  - id: branch
    title: Branch and work on it
    actor: product-owner
    goal: Feature work lands on a branch the product owner created, and main stays releasable.
    dependsOn: [pick-spec-plan]
    intro: |
      Main is always releasable: what is on main ships as the latest pre-release, and tagged releases are cut from it. Feature work branches; a branch may bundle several topics, one combined commit per cycle. How an agent works on it: [CLAUDE.md's Roles](../CLAUDE.md#roles).
    steps:
      - id: create
        say: Create the branch for the topic.
        when: { run: { command: "git switch -c <branch-name>" } }
        detail: |
          The product owner creates every branch, and whoever initiates a branch submits its pull request. The agent works on the branch it is given and asks when a change does not belong there. The one exception: a small fix, already verified, goes straight to main.
      - id: session
        say: Start a fresh agent session for the branch.
        when: { manual: "A new Claude session, not the one the last branch used." }
        detail: |
          The previous topic's context steers the next one, and a long context costs every turn. A large commit is a point to start fresh too: the next commit then begins from the repository rather than from the conversation.
      - id: work
        say: Prove the change on the desktop.
        actor: contributor
        when: { process: desktop-build-test }
        detail: |
          Keep each commit under about 100 changed files: CodeRabbit reviews the files a pushed commit changes, and past that the commit silently loses a review layer. A mechanical sweep, such as em-dashes or a metrics refresh, is a commit of its own, apart from behavioral fixes, so both stay reviewable.
  - id: build-setup
    title: Set up a computer to build MoonLight
    actor: contributor
    goal: uv, CMake 3.20 or newer and a C++20 compiler on the machine, once.
    systems: [MoonDeck]
    inputs:
      type: object
      properties:
        platform: { type: string, enum: [macOS, Linux, Windows], description: "Which computer?" }
    steps:
      - id: mac
        say: Install the command line tools, CMake and uv.
        given: [{ input: platform, equals: macOS }]
        when: { run: { command: "xcode-select --install; brew install cmake uv" } }
      - id: linux
        say: Install CMake, a compiler and uv.
        given: [{ input: platform, equals: Linux }]
        when: { run: { command: "sudo apt install cmake g++ && curl -LsSf https://astral.sh/uv/install.sh | sh" } }
        detail: |
          GCC 12 or Clang 15 from your distribution, and uv from astral's installer.
      - id: windows
        say: Install CMake and the Visual Studio Build Tools.
        given: [{ input: platform, equals: Windows }]
        when: { run: { command: "winget install Kitware.CMake; winget install astral-sh.uv; winget install Microsoft.VisualStudio.2022.BuildTools --override \"--passive --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended\"" } }
        detail: |
          Visual Studio 2022 with the MSVC v143 workload and the Windows 11 SDK, from an elevated terminal.

          Build and test from a **Developer PowerShell for VS 2022**, so `cl.exe` and the SDK are on `PATH`.
      - id: moondeck
        say: Start MoonDeck.
        when: { run: { command: "uv run moondeck/moondeck.py" } }
        detail: |
          Open `http://localhost:8420` in the browser. Every MoonDeck script a process runs is one of its cards, and the same scripts run from a terminal.
  - id: setup-editor
    title: Set up the editor
    actor: contributor
    goal: Diagnostics appear as you type, from the same `.clang-tidy` CI uses.
    systems: [MoonDeck]
    dependsOn: [build-setup]
    steps:
      - id: clangd
        say: Install the clangd extension.
        when: { run: { command: "code --install-extension llvm-vs-code-extensions.vscode-clangd" } }
        detail: |
          Nothing else to configure: `.clangd` points at the compilation database, and any build refreshes it, since `CMakeLists.txt` sets `CMAKE_EXPORT_COMPILE_COMMANDS`. clangd skips the checks it counts as slow, so CI stays the authority.
      - id: intellisense
        say: Turn off IntelliSense.
        when: { manual: "With clangd, it reports every diagnostic twice, and they disagree." }
      - id: build-once
        say: Build the desktop once.
        when: { run: { script: moondeck/build/build_desktop.py } }
        detail: |
          It writes the compilation database clangd reads.

          **Every file reports `'cstdint' file not found`?** The build directory was configured with another compiler than clangd uses. `.clangd`'s `--query-driver` covers the usual ones; add a new toolchain there.
  - id: bump-idf
    title: Bump the ESP-IDF pin
    actor: contributor
    goal: Every ESP32 target builds on the new IDF, locally and in CI.
    systems: [MoonDeck]
    dependsOn: [esp32-build-flash]
    intro: |
      A pin move is a deliberate re-test pass, never a routine pull. What the pin is and why: [ESP-IDF version](reference/build-system.md#esp-idf-version).
    steps:
      - id: pins
        say: Move the pin in its three places.
        when: { manual: "build_esp32.py's PINNED_IDF_COMMIT and PINNED_IDF_VERSION; release.yml's esp_idf_version and its cache key; build-system.md's ESP-IDF version." }
        detail: |
          In `moondeck/build/build_esp32.py`; in `.github/workflows/release.yml` the Docker tag `esp_idf_version` and the `esp-idf-v<version>` cache key; and the tag and commit [the build system](reference/build-system.md#esp-idf-version) names.
      - id: fetch
        say: Fetch the new tag into the IDF checkout.
        when: { run: { command: "git -C ~/esp/esp-idf fetch origin tag <PINNED_IDF_VERSION>" } }
      - id: checkout
        say: Move the IDF checkout onto the new pin.
        when: { run: { script: moondeck/build/setup_esp_idf.py } }
        detail: |
          Setup checks out the pinned commit and its submodules, recursively: a different IDF commit without its submodules builds against the old ones.
      - id: build-all
        say: Build every ESP32 firmware, one at a time.
        when: { manual: "build_esp32.py --firmware <name>, once per variant." }
        detail: |
          One at a time: the variants share their managed components.
      - id: retest
        say: Re-test each chip family on a board.
        when: { process: live-verification }
        detail: |
          A classic, an S3, an S31 and a P4, with the device scenarios.
      - id: commit
        say: Commit the pin move.
        when: { process: commit }
