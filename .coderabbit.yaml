language: "en-US"

reviews:
  profile: "assertive"
  # Reviews run on request, "@coderabbitai review" (incremental) or "@coderabbitai full review" on the PR, so they land when the product owner wants them, within CodeRabbit's hourly budget.
  auto_review:
    enabled: false
    drafts: false
    base_branches: ["main"]
    # Never pause: every review is asked for by hand, so a pause only swallows the next request.
    auto_pause_after_reviewed_commits: 0

  path_filters:
    - "!**/build/**"
    - "!test/doctest.h"

  # The rules have one home each; CodeRabbit reads them from the files below rather than from a copy here.
  instructions: |
    Review against CLAUDE.md, docs/contributing/coding-standards.md and docs/contributing/documentation-standards.md, which hold every rule.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "docs/contributing/coding-standards.md"
      - "docs/contributing/documentation-standards.md"
