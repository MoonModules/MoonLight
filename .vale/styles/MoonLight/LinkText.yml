# documentation-standards.md: "A link's text says what it reaches." "See here" does not tell the reader whether to follow
# it. The words below, alone as the text of a link, name nothing.
extends: existence
message: "A link reading '%s' does not say what it reaches: name the page or the thing."
level: warning
ignorecase: true
scope: raw
raw:
  - '\[(?:here|this|link|this link|click here|more|read more|page|this page)\]\('
