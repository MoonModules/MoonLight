name: Generated files

# A contributor's pull request leaves the generated files out: the metrics and a scenario's observation blocks are measured on the contributor's machine, and the merge regenerates them on ours. A warning rather than a failure, since a pull request can mean to change one, a new scenario for one.

on:
  pull_request:
    paths:
      - 'docs/reference/metrics/**'
      - 'test/scenarios/**'

jobs:
  warn:
    # Pull requests from a fork only: on ours, the merge is where the files are regenerated.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - name: Name each generated file the pull request changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: uv run moondeck/ci/github_annotations.py --generated --base "$BASE"
