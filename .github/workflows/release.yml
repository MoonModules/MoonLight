name: Release

# The release pipeline. Builds every shipped ESP32 firmware (the matrix from mooninstaller/firmwares.json), the Teensy firmware and the desktop packages (macOS arm64, Windows x64, Linux x64 and arm64) in parallel, writes an ESP Web Tools manifest per firmware, attaches everything to the GitHub release, publishes the container image, and deploys the installer page to GitHub Pages.
#
# Two triggers produce a release:
#   - push to main touching a path below → tags/publishes as `latest` (a moving prerelease, always the newest build from main)
#   - push of a vX.Y.Z tag → stable/RC release
#
# Manual replay: workflow_dispatch with an existing tag, useful for retries
# after a transient runner failure (CI is the only producer of release assets;
# never upload by hand).

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'src/**'
      # The desktop jobs compile the whole tree, tests included (CMakeLists adds test/
      # unconditionally), so MSVC and Apple clang see the test suite too — and both have
      # rejected code here that the local clang build accepts. Without this line a test-only
      # fix cannot trigger the job that flagged it, which left main red twice: the C4146 and
      # C4701 fixes each shipped unverified because they touched only test/.
      - 'test/**'
      - 'esp32/**'
      - 'teensy/**'
      - 'moondeck/build/**'
      # package_desktop.py builds and packages the three desktop jobs; without this line a
      # packaging fix cannot trigger the jobs that run it (the NSIS-escape fix needed a
      # manual dispatch because only moondeck/ci changed).
      - 'moondeck/ci/**'
      - 'CMakeLists.txt'
      - 'library.json'
      - '.github/workflows/release.yml'
      # The web installer + docs site are served from Pages by the deploy-pages job
      # below; a change to them must trigger a deploy or it never reaches the live site
      # (the eth-only-provisioning fix shipped a commit that didn't auto-deploy because
      # mooninstaller was missing here). src/ui/install-picker*.js is already covered by src/**.
      # docs/** covers every page rendered into the Pages root by MkDocs; mkdocs.yml is
      # the site config (nav/theme) — a nav change with no doc change must still redeploy.
      - 'docs/**'
      - 'mooninstaller/**'
      - 'mkdocs.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v1.0.0'
        required: true

# Run one release at a time per tag — prevents two concurrent runs from
# racing on the same release page or Pages deployment. Branch pushes get
# their own concurrency group so a tag and a branch can build in parallel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Minimal default permissions for every job (read-only). The release job
# overrides this locally with the write/id-token scopes it needs to publish
# the GitHub release + deploy Pages. Verify and build jobs inherit read-only,
# which is all they need (checkout + artifact upload via OIDC).
permissions:
  contents: read

jobs:
  verify-version:
    # Runs on every trigger so downstream `needs:` are always satisfied.
    # Version check only applies to real version tags — skip for main push
    # (latest) and workflow_dispatch with a non-version tag.
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false on every checkout that doesn't push — keeps the
      # GITHUB_TOKEN out of .git/config where later steps (incl. third-party Docker
      # actions) could read it. The `release` job is the one exception: its
      # "Re-create latest" step does `git push -f`, so it keeps the credential.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
      - name: Verify tag matches library.json version
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
        # Pass the tag via --tag arg, not via an env var named GITHUB_REF_NAME.
        # The built-in GITHUB_REF_NAME is "main" on a push-to-main and would
        # shadow a step-level env override. Explicit CLI arg sidesteps the
        # collision. Plumbed via env to avoid static-analyzer template-injection
        # warning on the direct ${{ }} expansion inside a shell string.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: uv run moondeck/ci/verify_version.py --tag "$TAG"

  # The shipping ESP32 firmware list, read from the generated mooninstaller/firmwares.json
  # (projected from the firmwares.py registry, drift-guarded by check_firmwares.py). Emitted as a JSON array of {firmware, chip} so build-esp32's matrix can
  # fromJSON() it: GitHub matrices can't read a file at parse time, so a job output is the
  # standard bridge. This is the ONLY firmware list in CI, and the chip is the IDF target.
  firmwares:
    needs: verify-version
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.gen.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
      - id: gen
        run: uv run moondeck/ci/release_stage.py firmwares

  build-esp32:
    needs: [verify-version, firmwares]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.firmwares.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: compute_version.py counts commits since the last v* tag
          # for the `latest` build's `-dev.<N>` suffix. A shallow clone (the default)
          # has no tags / partial history and would yield a wrong count.
          fetch-depth: 0

      - name: Cache ESP-IDF tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/esp/esp-idf
          # Bump the suffix when changing the IDF version to invalidate.
          key: esp-idf-v6.1-${{ runner.os }}-v1

      # The staging step's MoonBase block runs `uv run python` on the RUNNER (the ESP-IDF
      # docker action only provides Python inside its container), so uv must exist there.
      # First main run without it: `uv: command not found`, exit 127, three 4 MB variants.
      - uses: astral-sh/setup-uv@v3

      # The release-channel tag burned into the binary as MM_RELEASE (shown by
      # SystemModule alongside the semver). Same resolution as the release
      # job's "Resolve effective tag" step — kept here because this build job
      # runs before that one. workflow_dispatch tag wins; main push → latest;
      # a vX.Y.Z tag push → that tag.
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: uv run moondeck/ci/release_stage.py tag --input-tag "$INPUT_TAG" --ref "$GITHUB_REF" --ref-name "$GITHUB_REF_NAME"

      # The semver burned into the binary + stamped on the assets/manifest. A
      # `latest` build gets `<core>-dev.<N>` (N = commits since the last v* tag)
      # so successive latest builds are orderable; a stable tag gets the core.
      # Computed once here and reused by build + staging so all three agree.
      - name: Compute version
        id: ver
        # The channel (latest vs stable) and the -rc handling both live in
        # compute_version.py — pass only the tag, the helper derives the rest, so
        # this step and the release job's identical step can't disagree.
        # Tag passed via env (not inline ${{ }}) so it reaches the script as a
        # plain shell variable, never spliced into the command text — no shell
        # injection from a crafted tag/ref.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: uv run moondeck/ci/release_stage.py version --tag "$TAG"

      # The espressif/idf image ships ccache and turns it on; the workspace mount carries the cache in and out.
      - uses: ./.github/actions/ccache
        with:
          key: esp32-${{ matrix.firmware }}
          install: 'false'
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          # The espressif/idf Docker tag of the local pin (PINNED_IDF_COMMIT in build_esp32.py), a fixed release tag rather than the rolling `release-v6.1`, so CI and local build the same tree; v5.x lacks the v6 APIs platform_esp32.cpp uses, and moving the pin is a re-test pass (the bump-idf process in moonwalk/09-plan-setup.yaml).
          esp_idf_version: v6.1
          # The IDF target is the firmware's declared chip, carried by the matrix from firmwares.json.
          target: ${{ matrix.chip }}
          path: 'esp32'
          # We run our own builder (not the action's default `idf.py build`)
          # so the sdkconfig fragments and EXCLUDE_COMPONENTS go through the
          # same code path as local builds. --release burns the channel tag in.
          command: python ../moondeck/build/build_esp32.py --firmware ${{ matrix.firmware }} --release "${{ steps.tag.outputs.tag }}" --version "${{ steps.ver.outputs.version }}" && ccache --show-stats
          extra_docker_args: -e CCACHE_DIR=/app/${{ github.repository }}/.ccache

      # Per-firmware build dir build/esp32-<firmware>/ (build_esp32.py points idf.py at it with -B), so several firmwares coexist: CI uses one per matrix job, dev machines as many as built. The version is the one computed above, matching the binary's MM_VERSION.
      - name: Stage release artifacts
        env:
          FIRMWARE: ${{ matrix.firmware }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: uv run moondeck/ci/release_stage.py stage-esp32 --firmware "$FIRMWARE" --version "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: esp32-${{ matrix.firmware }}
          path: dist/

  build-macos-arm64:
    needs: verify-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: compute_version.py counts commits since the last v* tag.
          fetch-depth: 0
      # CMakeLists.txt calls find_program(UV_EXECUTABLE … REQUIRED) so the
      # build-host Python (gzip / build_info.h) is reached through uv. The
      # runners don't ship uv by default — install it before package_desktop.
      - uses: astral-sh/setup-uv@v3
      # Same tag + version resolution as build-esp32 (see the comments there): the computed
      # semver must reach the DESKTOP binary too, or a desktop build reports library.json's bare
      # core and the update badge can never see a `latest` (-dev.N) build as newer. shell: bash
      # keeps the three jobs' copies of this block identical; without it the Windows copy would
      # run under PowerShell and fail on the bash syntax.
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: uv run moondeck/ci/release_stage.py tag --input-tag "$INPUT_TAG" --ref "$GITHUB_REF" --ref-name "$GITHUB_REF_NAME"
      - name: Compute version
        id: ver
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: uv run moondeck/ci/release_stage.py version --tag "$TAG"
      - uses: ./.github/actions/ccache
        with:
          key: macos-arm64
      - name: Build + package macOS arm64
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: uv run moondeck/ci/package_desktop.py --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: dist/

  build-windows-x64:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Same uv prerequisite as build-macos-arm64, see the comment there.
      - uses: astral-sh/setup-uv@v3
      # Same tag + version resolution as build-esp32 (see the comments there): the computed
      # semver must reach the DESKTOP binary too, or a desktop build reports library.json's bare
      # core and the update badge can never see a `latest` (-dev.N) build as newer. shell: bash
      # keeps the three jobs' copies of this block identical; without it the Windows copy would
      # run under PowerShell and fail on the bash syntax.
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: uv run moondeck/ci/release_stage.py tag --input-tag "$INPUT_TAG" --ref "$GITHUB_REF" --ref-name "$GITHUB_REF_NAME"
      - name: Compute version
        id: ver
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: uv run moondeck/ci/release_stage.py version --tag "$TAG"
      # The runner image does NOT ship NSIS (the first release run after the installer merged
      # proved it: "no makensis on this CI runner"). choco installs it into
      # Program Files (x86)\NSIS, one of the two locations find_makensis already searches.
      #
      # RETRIED AND VERIFIED, because `choco install` exits 0 when it installed nothing. A 503 from
      # the Chocolatey CDN (run 34470353617) left the step green and failed the build two steps
      # later with "no makensis on this CI runner", which names our script rather than the outage.
      # So: three attempts, then assert the binary exists and fail here if it does not.
      - name: Install NSIS (the Windows installer compiler)
        shell: pwsh
        run: |
          # Both install locations, and the same two find_makensis searches. Braces are required
          # around the x86 name: "$env:ProgramFiles(x86)" parses as $env:ProgramFiles followed by
          # a literal "(x86)", which is a path that never exists.
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          function Find-Nsis { $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          foreach ($attempt in 1..3) {
            if (Find-Nsis) { break }
            Write-Host "choco install nsis (attempt $attempt of 3)"
            choco install nsis --no-progress -y
            if (Find-Nsis) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
          }
          $found = Find-Nsis
          if (-not $found) {
            throw "NSIS did not install after 3 attempts. Chocolatey exits 0 even when it installs nothing, so look above for a CDN error (a 503 caused run 34470353617)."
          }
          Write-Host "NSIS present: $found"
      - name: Build + package Windows x64
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: uv run moondeck/ci/package_desktop.py --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/

  # **ubuntu-22.04, pinned like build-linux-arm64, and this is load-bearing.** A binary carries the
  # glibc floor of the machine that built it, and `ubuntu-latest` moves: when it moved on, the amd64
  # package came to need glibc 2.43 and died at startup on Debian 13, Ubuntu 24.04 and in our own
  # container, while the arm64 one still needed 2.35. Both build on 22.04 now, with the same GCC 12,
  # and check-glibc-floor below fails the release if either needs more.
  build-linux-x64:
    needs: verify-version
    runs-on: ubuntu-22.04
    env:
      CC: gcc-12      # 22.04's default is GCC 11; 12 is what build-linux-arm64 builds with
      CXX: g++-12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Same uv prerequisite as build-macos-arm64, see the comment there.
      - uses: astral-sh/setup-uv@v3
      # libcurl is the ONE outbound HTTPS client, and CMake treats it as optional so a
      # contributor's machine still builds without it. That optionality is wrong for a PUBLISHED
      # artifact: the ubuntu runners carry no libcurl dev package, so every released Linux binary
      # until now shipped with the feature compiled out. `|| true` because a transient apt failure
      # should not abort a release on its own; CMake's own check is what decides, and it fails the
      # build loudly when the library really is absent.
      - name: Install libcurl (MoonCloud, only used once consent is given in the app)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev g++-12 || true
      # GCC 12's four false-positive warnings are handled in CMakeLists.txt, which demotes them to
      # non-fatal on GCC below 16: a from-source build on Debian or Raspberry Pi OS meets the same
      # GCC and deserves the same fix.
      # Same tag + version resolution as build-esp32 (see the comments there): the computed
      # semver must reach the DESKTOP binary too, or a desktop build reports library.json's bare
      # core and the update badge can never see a `latest` (-dev.N) build as newer. shell: bash
      # keeps the three jobs' copies of this block identical; without it the Windows copy would
      # run under PowerShell and fail on the bash syntax.
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: uv run moondeck/ci/release_stage.py tag --input-tag "$INPUT_TAG" --ref "$GITHUB_REF" --ref-name "$GITHUB_REF_NAME"
      - name: Compute version
        id: ver
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: uv run moondeck/ci/release_stage.py version --tag "$TAG"
      - uses: ./.github/actions/ccache
        with:
          key: linux-x64
      - name: Build + package Linux x64
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: uv run moondeck/ci/package_desktop.py --version "$VERSION"
      - name: Check the glibc floor
        run: uv run moondeck/ci/check_glibc_floor.py dist/moonlight_*_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/

  # The arm64 twin of build-linux-x64: Raspberry Pi, NanoPi and every other 64-bit board, which
  # otherwise have to compile from source for an hour.
  #
  # **ubuntu-22.04-arm, not 24.04, and this is load-bearing.** A binary carries the glibc floor of
  # the machine that built it, and 22.04 ships glibc 2.35 where 24.04 ships 2.39. Raspberry Pi OS
  # Bookworm, the most widely deployed board OS, has 2.36: a 24.04-built package installs there
  # cleanly and then dies at startup with "GLIBC_2.38 not found", the same failure the Dockerfile
  # records hitting on debian12. Building against the lower floor covers Bookworm (2.36), Debian 13
  # trixie (2.41) and Ubuntu 24.04 (2.39) alike, because glibc symbol versioning is backward
  # compatible. Its GCC is 12, which CMakeLists already covers: it demotes the four false-positive
  # warnings for every GCC below 16.
  build-linux-arm64:
    needs: verify-version
    runs-on: ubuntu-22.04-arm
    env:
      CC: gcc-12      # named, as in build-linux-x64, so both architectures build with one compiler
      CXX: g++-12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      # libcurl is the ONE outbound HTTPS client, and CMake treats it as optional so a
      # contributor's machine still builds without it. That optionality is wrong for a PUBLISHED
      # artifact: the ubuntu runners carry no libcurl dev package, so every released Linux binary
      # until now shipped with the feature compiled out. `|| true` because a transient apt failure
      # should not abort a release on its own; CMake's own check is what decides, and it fails the
      # build loudly when the library really is absent.
      - name: Install libcurl (MoonCloud, only used once consent is given in the app)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev g++-12 || true
      # Same tag + version resolution as every other build job; see build-linux-x64 for why.
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: uv run moondeck/ci/release_stage.py tag --input-tag "$INPUT_TAG" --ref "$GITHUB_REF" --ref-name "$GITHUB_REF_NAME"
      - name: Compute version
        id: ver
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: uv run moondeck/ci/release_stage.py version --tag "$TAG"
      - uses: ./.github/actions/ccache
        with:
          key: linux-arm64
      - name: Build + package Linux arm64
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: uv run moondeck/ci/package_desktop.py --version "$VERSION"
      - name: Check the glibc floor
        run: uv run moondeck/ci/check_glibc_floor.py dist/moonlight_*_arm64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-arm64
          path: dist/

  # The Teensy 4.1 firmware, a HEX for teensy_loader_cli or PJRC's Teensy app; test.yml builds it on every PR as well.
  build-teensy:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - name: the Arm toolchain's version, which keys its cache
        id: gcc
        run: uv run moondeck/ci/release_stage.py gcc-version
      - uses: actions/cache@v4
        with:
          path: ~/teensy/arm-gnu-toolchain-*
          key: teensy-gcc-${{ runner.os }}-${{ steps.gcc.outputs.version }}
      - uses: ./.github/actions/ccache
        with:
          key: teensy
      # Same tag and version resolution as build-esp32, so the HEX reports the version and channel its asset name carries.
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: uv run moondeck/ci/release_stage.py tag --input-tag "$INPUT_TAG" --ref "$GITHUB_REF" --ref-name "$GITHUB_REF_NAME"
      - name: Compute version
        id: ver
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: uv run moondeck/ci/release_stage.py version --tag "$TAG"
      - name: Install the Teensy SDK
        run: uv run moondeck/build/setup_teensy.py --no-loader
      - name: Build the Teensy 4.1 firmwares
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          V: ${{ steps.ver.outputs.version }}
        run: uv run moondeck/ci/release_stage.py stage-teensy --tag "$TAG" --version "$V"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-teensy41
          path: dist/

  release:
    # Publish a release on: version tag push, main branch push, or workflow_dispatch.
    # Plain branch push without matching paths is filtered by the top-level `paths:`
    # so the build jobs already won't run; this condition is the belt to their braces.
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [build-esp32, build-teensy, build-macos-arm64, build-windows-x64, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write     # softprops/action-gh-release needs this
    # Expose the resolved tag so the tag-only restage job below can dispatch a
    # main-context Pages deploy for it (the github-pages environment trusts only
    # the `main` ref, so a tag push can't deploy Pages itself).
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      # The resolved semver, so the container job can tag its image with the same string the
      # binary reports. Computed here already for the manifests; exposed rather than recomputed,
      # because two computations are two chances to disagree about what this release is called.
      version: ${{ steps.ver.outputs.version }}
    # No `environment: github-pages` here: that environment's protection rule
    # only allows `main`, so binding asset-publishing to it made every vX.Y.Z
    # tag run fail BEFORE any step ran — including the asset upload — leaving
    # tagged releases with zero binaries. Pages deploy lives in its own job
    # below (gated to main, the only ref the environment trusts).
    steps:
      # NB: this checkout KEEPS persisted credentials (unlike the other jobs) —
      # the "Re-create latest" step below force-pushes the `latest` tag with git,
      # which needs the token in .git/config.
      - uses: actions/checkout@v4
        with:
          # Full history: compute_version.py counts commits since the last v* tag
          # for the manifest's `-dev.<N>` version (must match the binary's).
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into dist/
        run: uv run moondeck/ci/release_stage.py gather

      # The Open Stage Control surface, so someone who owns a device can download it beside the
      # firmware instead of being sent to a path inside the repo. It is a plain session file with
      # no build step: copied, not generated. The module help beside it is the one this release's app shows, so a device reads the help of the firmware it runs (a newer file names controls it lacks); deploy-pages mirrors it beside the release's binaries, where the device's page can read it.
      - name: Stage the control-surface session and the module help
        run: uv run moondeck/ci/release_stage.py extras

      - name: Resolve effective tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: uv run moondeck/ci/release_stage.py tag --input-tag "$INPUT_TAG" --ref "$GITHUB_REF" --ref-name "$GITHUB_REF_NAME"

      # Same computation as the build job's "Compute version" — the manifest's
      # version must match the binary's MM_VERSION + the asset names. Channel +
      # -rc handling live in compute_version.py; pass only the tag (this job has
      # setup-uv, so `uv run`).
      - name: Compute version
        id: ver
        # Tag via env (not inline ${{ }}) to keep it out of the command text —
        # no shell injection from a crafted tag/ref.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: uv run moondeck/ci/release_stage.py version --tag "$TAG"

      # Absolute GitHub release-asset URLs, uploaded as release assets and read by the on-device OTA picker (the device fetches the .bin directly, no CORS). The Pages-relative manifests are generated in the deploy-pages job, where the web installer (CORS-bound) consumes them. The shipping list is the mooninstaller/firmwares.json the build matrix reads, so manifests and builds cannot drift.
      - name: Generate the installer manifests (release-asset URLs)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          V: ${{ steps.ver.outputs.version }}
        run: uv run moondeck/ci/release_stage.py manifests --tag "$TAG" --version "$V" --repo "$GITHUB_REPOSITORY"

      - name: Re-create the `latest` release fresh
        # The `latest` tag is a moving prerelease: every main-branch build
        # republishes it pointing at the new commit. Two things have to
        # happen for the Releases page to show the right state:
        #
        #   1. The tag must point at the new commit. Force-push it.
        #   2. The release's `published_at` must reset to now. This is the
        #      subtle one: softprops/action-gh-release reuses an existing
        #      release (PATCH) rather than recreating it, and GitHub keeps
        #      the original `published_at` on a PATCH of an already-
        #      published release. Result: assets update to today's build
        #      but the Releases page still sorts/displays the release at
        #      last week's date (the date it was first published). The
        #      action exposes no `published_at` input, and PATCHing it
        #      directly is ignored by the API for published releases — so
        #      the only reliable reset is to DELETE the release here and
        #      let the publish step below create it fresh (new release
        #      object → `published_at` = now).
        #
        # Deleting the release does NOT delete the tag (we keep the tag,
        # force-pushed above). The window between delete and recreate is
        # sub-second within this job; the web installer's release-dropdown
        # read from api.github.com tolerates it.
        #
        # Version tags (vX.Y.Z, vX.Y.Z-rcN) are never touched here — those
        # are immutable by contract and their releases are created once.
        if: steps.tag.outputs.tag == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 1. Move the tag to the new commit.
          git tag -f latest "$GITHUB_SHA"
          git push -f origin "refs/tags/latest"
          # 2. Delete the existing `latest` RELEASE (not the tag) so the
          #    publish step recreates it with a fresh published_at.
          #    `gh release delete` keeps the tag by default (only removes
          #    it if --cleanup-tag is passed), so the tag we force-pushed
          #    above survives. Tolerate "release not found" — first-ever
          #    latest build, or a prior run that already removed it.
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes \
            || echo "  (no existing latest release to delete — first build or already gone)"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          # Release `name` is the computed semver (e.g. "2.1.0-dev.7"). The device-
          # hosted UI's dev-channel update check reads it from the CORS-readable
          # GitHub API (releases/tags/latest) — the manifest-*.json asset that also
          # carries the version is fetched via a release-asset URL that redirects to
          # release-assets.githubusercontent.com, which sends no CORS header, so the
          # browser blocks that read from the device origin. The API exposes `name`
          # cross-origin, so surfacing the version here is what makes the badge work.
          name: ${{ steps.ver.outputs.version }}
          # latest and vX.Y.Z-rcN tags are prerelease — they sort below stable
          # on the Releases page and aren't picked up by tooling that asks for
          # "latest release". Stable vX.Y.Z tags publish normally.
          prerelease: ${{ steps.tag.outputs.tag == 'latest' || contains(steps.tag.outputs.tag, '-rc') }}
          fail_on_unmatched_files: true
          # The `files:` block below is a multi-line literal string — every line
          # is a glob pattern, the action does NOT strip `#` as comment syntax.
          files: |
            dist/firmware-*.bin
            dist/firmware-*.hex
            dist/shared-*.bin
            dist/manifest-*.json
            dist/MoonLight-*.tar.gz
            dist/MoonLight-*.zip
            dist/MoonLight-control-surface.json
            dist/MoonLight-help.json
            dist/MoonLight-*.dmg
            dist/MoonLight-*-setup.exe
            dist/moonlight_*.deb

  # Publish the container image to the GitHub Container Registry, one per release.
  #
  # It runs AFTER `release` and pulls the .deb from that job's artifacts rather than downloading it
  # from the API: the release the image describes is the one that just built, so taking the package
  # from the same run is what makes the image and the binary provably the same build. It also means
  # the image exists the moment the release does, with no window where `latest` points at the
  # previous version.
  #
  # Multi-arch: one tag serves an amd64 server and an arm64 board, because the release now builds
  # a .deb for each. Buildx selects the matching package per platform via TARGETARCH.
  publish-container:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # push to ghcr.io; GITHUB_TOKEN carries it, no secret to manage
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3

      # The same .debs the release published, from the same run: one per architecture.
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux-arm64
          path: dist

      # The arm64 stage runs `dpkg-deb -x` on an amd64 runner, which needs emulation. Only the
      # unpack is emulated: nothing is compiled here, so the cost is seconds.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase, because a registry path must be and the org is not: `MoonModules/MoonLight`
      # would be rejected where `moonmodules/moonlight` is accepted.
      - name: Resolve image name
        id: img
        run: uv run moondeck/ci/release_stage.py image-name --repo "$GITHUB_REPOSITORY"

      # A build context of just the .deb, so the image installs THIS run's package instead of
      # resolving one from the API the way a local `docker build` does. Written here rather than
      # kept as a second Dockerfile in the repo: it is four lines, and two Dockerfiles that must
      # agree about the runtime is exactly the duplication that drifts.
      - name: Write the release Dockerfile
        run: uv run moondeck/ci/release_stage.py container-context

      # Each architecture's image runs before any is published, since an image whose binary dies at
      # startup (a missing library, a glibc its base lacks) installs cleanly and fails on a user's board.
      # One load per platform, since a multi-platform build cannot load; the push below reuses the cache.
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          platforms: linux/amd64
          load: true
          tags: moonlight-smoke:amd64
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          platforms: linux/arm64
          load: true
          tags: moonlight-smoke:arm64
      # amd64 runs natively and must answer its API. arm64 runs under QEMU, where an emulated render
      # loop makes a response time a matter of the runner, so it must survive its start: the loader
      # resolves every library and glibc symbol in the first second or the process dies.
      - name: Run each image
        run: uv run moondeck/ci/release_stage.py smoke-images

      # Two tags: the exact version, which never moves, and `latest`, which follows this workflow's
      # own notion of latest (the rolling prerelease from main, or a tagged release). A user pins
      # one or tracks the other.
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.release.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.description=Drive large LED installations and DMX fixtures
            org.opencontainers.image.licenses=GPL-3.0

  # Deploy the web installer to GitHub Pages. Separate from `release` because
  # the `github-pages` environment's protection rule allows only `main` and `v*`
  # tags, so this job is gated to those and carries the environment, while
  # `release` (which runs on any ref) stays free of it. A tag deploys in its own
  # run, so a release reaches the installer with its binaries. The cumulative-
  # content step restages the last 5 stable + 5 prerelease releases on every run.
  deploy-pages:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write        # actions/deploy-pages needs this
      id-token: write     # actions/deploy-pages needs this (OIDC for Pages)
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v3

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into dist/
        run: uv run moondeck/ci/release_stage.py gather

      - name: Stage cumulative release content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Keep the last 5 stable + 5 prerelease releases on Pages so their
          # binaries stay flashable (Web Serial is CORS-bound and GitHub
          # release assets don't return CORS headers).
          STABLE=$(gh release list --limit 50 --exclude-drafts \
                   --json tagName,isPrerelease \
                   | jq -r '.[] | select(.isPrerelease|not) | .tagName' | head -5)
          PRE=$(gh release list --limit 50 --exclude-drafts \
                --json tagName,isPrerelease \
                | jq -r '.[] | select(.isPrerelease) | .tagName' | head -5)
          KEEP=$(printf '%s\n%s\n' "$STABLE" "$PRE" | sort -u)
          echo "Releases to keep on Pages:"
          echo "$KEEP" | sed 's/^/  /'

          # For each kept tag, stage its binaries AND its manifests onto Pages. A
          # GitHub Pages deploy is a full-tree REPLACE (not cumulative — that wrong
          # assumption is what made a tag's manifests vanish on the next deploy), so
          # every run must reconstruct ALL served tags, not just the one being built.
          #
          # Use each release's OWN published manifest, not a freshly generated one:
          # the asset-naming scheme has changed across releases (v1.0.0 used
          # per-firmware `firmware-<F>-v<ver>-partition-table.bin` / `-ota-data.bin`;
          # v2.0.0 to v7.0.0 used shared `partition-table-<size>.bin` / `shared-ota-data.bin`;
          # later ones a per-firmware `-partition-table.bin` and `shared-ota-data.bin`),
          # so regenerating an old tag's manifest with today's generator points it at
          # files that release never published → a fetch-firmware 404. Each release's
          # own manifest already names its own files correctly; we just rewrite its
          # ABSOLUTE github.com asset URLs (which a browser can't fetch — no CORS) to
          # RELATIVE basenames, so the installer fetches them same-origin from the
          # Pages dir alongside the binaries we download next to them.
          for T in $KEEP; do
            mkdir -p "pages/install/releases/$T"
            gh release download "$T" \
              --dir "pages/install/releases/$T" \
              --pattern 'firmware-*.bin' \
              --pattern '*-ota-data.bin' \
              --pattern 'shared-*.bin' \
              --pattern 'partition-table-*.bin' \
              --pattern 'manifest-*.json' \
              --pattern 'MoonLight-*.tar.gz' \
              --pattern 'MoonLight-*.zip' \
              --pattern 'MoonLight-help.json' \
              --pattern 'MoonLight-*.dmg' \
              --pattern 'moonlight_*.deb' \
              || echo "  (skip $T — no matching assets)"
            # Rewrite each manifest's part paths to relative basenames (strip the
            # absolute release-asset URL); jq edits in place via a temp file.
            for M in pages/install/releases/$T/manifest-*.json; do
              [ -f "$M" ] || continue
              jq '.builds[].parts[].path |= (sub("^.*/"; "./"))' "$M" > "$M.tmp" && mv "$M.tmp" "$M"
            done
            echo "Staged binaries + relative manifests into releases/$T"
          done

      # The install page and the picker modules at the root; each release's binaries and manifests live under releases/<tag>/.
      - name: Stage GitHub Pages site
        run: uv run moondeck/ci/release_stage.py pages-site

      # The docs/ tree (Material for MkDocs) is the Pages ROOT (moonmodules.github.io/MoonLight/), the project's front door. Config: mkdocs.yml; the build script declares its deps inline. It builds to a temp dir that is then copied INTO pages/, so the installer staged above under pages/install/ survives (a plain --site-dir pages would wipe it, since mkdocs cleans its output dir).
      - name: Render the docs site
        run: uv run moondeck/docs/build_docs.py --strict --site-dir "$RUNNER_TEMP/docs-site"
      - name: Merge the docs site into the Pages root
        run: uv run moondeck/ci/release_stage.py merge-docs --site-dir "$RUNNER_TEMP/docs-site"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - id: deploy-pages
        uses: actions/deploy-pages@v4

  # Stage a TAG release onto Pages. A vX.Y.Z tag push builds + publishes the
  # release assets (the `release` job), but it can NOT deploy Pages itself: the
  # github-pages environment trusts only the `main` ref, so deploy-pages is gated
  # to main and a tag push skips it — leaving the installer's same-origin
  # manifests for that version un-staged (a 404 at /install/releases/<tag>/).
  # Rather than relax the environment's branch policy (needs repo-admin), this
  # job re-invokes the workflow on `main` with `tag=<the tag>`, which runs
  # deploy-pages under the allowed `main` ref AND sets CUR_TAG=<the tag> (via the
  # `tag` input) so the manifests land in releases/<tag>/. Tag-push only, so it
  # never recurses (the dispatched run is a workflow_dispatch, not a tag push).
  restage-pages-for-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      actions: write      # gh workflow run (dispatch this same workflow)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dispatch a main-context Pages deploy for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Dispatching release.yml on main to stage Pages for $TAG"
          gh workflow run release.yml --ref main -f tag="$TAG"
