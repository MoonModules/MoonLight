# Generated by `uv run moondeck/docs/gen_moonwalk.py --issue-form` from the log-issue process in moonwalk/; edit the process, not this file.
name: Bug report
description: A bug report with the device's state attached.
labels:
- bug
body:
- type: markdown
  attributes:
    value: 'Describe what you saw and hand over the state of the device it happened on; diagnosing it is ours. Not sure it is a bug? Ask on [Discord](https://discord.gg/TC8NSUSCdV) first. A feature request needs no template and no diagnostics: describe the use case.


      [Log an issue](https://moonmodules.org/MoonLight/moonwalk.html#log-issue)'
- type: textarea
  id: version
  attributes:
    label: Which version and firmware does the device run?
    description: Check the version on the Firmware card.
- type: textarea
  id: diagnostics
  attributes:
    label: The diagnostics of System, Firmware and the card that went wrong
    description: Copy each card's diagnostics.
- type: textarea
  id: describe
  attributes:
    label: Steps to reproduce, what should happen, and what happens instead
    description: Describe the steps, the expected and the actual.
- type: textarea
  id: photo
  attributes:
    label: A photo or screenshot of what you see
    description: Add a photo of what you see.
